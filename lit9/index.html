<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFC93C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="ქართული ლიტერატურა IX კლასი — ძველი ქართული მწერლობა: ბარათები და ტესტები თავების მიხედვით.">
<title>ბარათები — ქართული ლიტერატურა IX</title>
<style>
  :root{
    --yellow:#FFC93C; --ink:#1b2438; --card:#ffffff;
    --soft:rgba(27,36,56,.08); --soft2:rgba(27,36,56,.18);
    --good:#1f8a5b; --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--yellow); color:var(--ink);
    font-family:"Segoe UI","Sylfaen",system-ui,-apple-system,sans-serif;
    line-height:1.5; padding:0 14px;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{max-width:430px;margin:0 auto;padding-block:14px 30px}

  .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .home{font-size:13px;color:var(--ink);text-decoration:none;opacity:.75;font-weight:600;flex:none}
  .home:hover{opacity:1}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px}
  .book{font-size:12.5px;opacity:.7;margin:2px 0 12px}

  /* ---------- ფილტრის ღილაკი ---------- */
  .filterbtn{width:100%;display:flex;align-items:center;gap:10px;
             background:var(--card);border:2px solid var(--ink);border-radius:15px;
             padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;
             box-shadow:0 3px 0 rgba(27,36,56,.14)}
  .filterbtn .ico{font-size:17px;flex:none}
  .filterbtn .txt{flex:1;min-width:0}
  .filterbtn .t1{font-size:14px;font-weight:800;line-height:1.25}
  .filterbtn .t2{font-size:11.5px;opacity:.7;font-weight:600;line-height:1.3}
  .filterbtn .arrow{flex:none;font-size:13px;opacity:.6;font-weight:800}

  /* ---------- ფილტრის პანელი ---------- */
  .panel{background:var(--card);border-radius:var(--radius);margin-top:9px;padding:14px 14px 12px;
         box-shadow:0 5px 0 rgba(27,36,56,.14), 0 12px 26px rgba(27,36,56,.14)}
  .panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;opacity:.55;
            margin:0 0 7px;font-weight:800}
  .panel h3.mt{margin-top:14px}
  .row{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;
       font:inherit;color:var(--ink);padding:9px 8px;border-radius:11px;cursor:pointer;text-align:left}
  .row:hover{background:#faf8f3}
  .row + .row{border-top:1px solid rgba(27,36,56,.07)}
  .box{flex:none;width:21px;height:21px;border:2px solid var(--soft2);border-radius:6px;
       display:grid;place-items:center;font-size:13px;font-weight:900;color:transparent}
  .row.on .box{background:var(--ink);border-color:var(--ink);color:var(--yellow)}
  .row .lbl{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.3}
  .row .sub{font-size:11.5px;font-weight:600;opacity:.6;display:block}
  .row .n{flex:none;font-size:12px;font-weight:700;opacity:.55}
  .row.ch .lbl{font-size:14.5px;font-weight:800}

  .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
  .pbtn{border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;
        font-size:13px;font-weight:700;padding:11px 6px;border-radius:12px;cursor:pointer}
  .pbtn.fill{background:var(--ink);color:var(--yellow)}
  .pbtn.full{grid-column:1 / -1}

  /* ---------- რეჟიმები ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0 0}
  .mode{border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;
        font-size:14px;font-weight:800;padding:11px 6px;border-radius:14px;cursor:pointer}
  .mode.on{background:var(--ink);color:var(--yellow)}

  /* ---------- ტესტი ---------- */
  .qbox{background:var(--card);border-radius:var(--radius);padding:26px 18px;
        box-shadow:0 6px 0 rgba(27,36,56,.14), 0 14px 30px rgba(27,36,56,.14);
        text-align:center;margin-bottom:11px}
  .qbox .tagq{font-size:10.5px;font-weight:800;opacity:.5;margin-bottom:10px;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qbox .qt{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:11px;width:100%;background:var(--card);
       border:2px solid var(--soft2);border-radius:14px;padding:13px 14px;font:inherit;
       font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;
       box-shadow:0 3px 0 rgba(27,36,56,.1)}
  .opt .let{flex:none;width:24px;height:24px;border-radius:8px;background:var(--soft);
            display:grid;place-items:center;font-size:12.5px;font-weight:800}
  .opt .ot{flex:1;min-width:0}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:#1f8a5b;background:#e8f6ee}
  .opt.ok .let{background:#1f8a5b;color:#fff}
  .opt.bad{border-color:#c0392b;background:#fdecea}
  .opt.bad .let{background:#c0392b;color:#fff}
  .opt.dim{opacity:.45}
  .fb{text-align:center;font-size:14px;font-weight:800;margin-top:11px}
  .fb.ok{color:#15704a}
  .fb.bad{color:#a5281b}
  .score{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:11px;
         display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;
         box-shadow:0 3px 0 rgba(27,36,56,.1)}

  /* ---------- მრიცხველი ---------- */
  .counter{font-size:12.5px;font-weight:700;opacity:.85;text-align:center;margin:14px 0 6px}
  .bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:12px}
  .bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}

  /* ---------- ბარათი ---------- */
  .flip{perspective:1200px;cursor:pointer;margin-bottom:12px}
  .inner{position:relative;transform-style:preserve-3d;
         transition:transform .45s cubic-bezier(.4,.1,.2,1);min-height:330px}
  .flip.on .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        background:var(--card);border-radius:var(--radius);padding:34px 20px 44px;
        box-shadow:0 6px 0 rgba(27,36,56,.14), 0 14px 30px rgba(27,36,56,.14);
        display:flex;flex-direction:column;justify-content:center;align-items:center;
        text-align:center;overflow-y:auto}
  .face.back{transform:rotateY(180deg)}
  .tag{position:absolute;top:11px;left:14px;right:14px;font-size:10.5px;font-weight:800;
       opacity:.5;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q{font-size:19.5px;font-weight:700;letter-spacing:-.2px}
  .a{font-size:17px;font-weight:600}
  .a b{background:#FFF0BE;padding:0 3px;border-radius:4px}
  .ex{font-size:14px;opacity:.75;margin-top:10px;font-weight:500}
  .tip{position:absolute;bottom:13px;left:0;right:0;font-size:11.5px;opacity:.5;font-weight:600}

  /* ---------- ნავიგაცია ---------- */
  .nav{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:7px}
  .btn{border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;
       font-size:14px;font-weight:700;padding:13px 6px;border-radius:14px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.good{background:var(--ink);color:var(--yellow)}
  .btn.wide{width:100%;margin-top:10px;padding:13px}
  .btn.light{background:var(--card)}

  .done{background:var(--card);border-radius:var(--radius);padding:30px 22px;text-align:center;
        box-shadow:0 6px 0 rgba(27,36,56,.14), 0 14px 30px rgba(27,36,56,.14)}
  .done .big{font-size:42px;line-height:1}
  .done h2{font-size:19px;margin:12px 0 6px}
  .done p{font-size:14px;opacity:.8;margin:0}
  .empty{background:var(--card);border-radius:var(--radius);padding:26px 20px;text-align:center;
         font-size:14.5px;box-shadow:0 6px 0 rgba(27,36,56,.14)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>ბარათები 🎴</h1>
    <a class="home" href="../">← ყველა წიგნი</a>
  </div>
  <p class="book">ქართული ლიტერატურა IX · მოსწავლის წიგნი, I ნაწილი</p>

  <button class="filterbtn" id="filterbtn" type="button">
    <span class="ico">⚙️</span>
    <span class="txt"><span class="t1" id="fbT1"></span><span class="t2" id="fbT2"></span></span>
    <span class="arrow" id="fbArrow">▾</span>
  </button>

  <div class="panel" id="panel" hidden></div>

  <div class="modes" id="modes">
    <button class="mode on" id="modeCards" type="button">🎴 ბარათები</button>
    <button class="mode" id="modeQuiz" type="button">✍️ ტესტი</button>
  </div>

  <div id="stage"></div>
</div>

<script>
/* ============================== მასალა წიგნიდან ============================== */
const CHAPTERS = [
  { no: 1, name: "ქრისტიანობა და მწერლობის დასაწყისი" },
  { no: 2, name: "„შუშანიკის წამება“" },
  { no: 3, name: "„აბოს წამება“" },
  { no: 4, name: "„გრიგოლ ხანძთელის ცხოვრება“" },
  { no: 5, name: "ათონელები და ჰიმნოგრაფია" },
];

const TOPICS = [
  { ch:1, no:"1.1", short:"ქრისტიანობა და კულტურა", name:"ქრისტიანობა და ქართული კულტურა" },
  { ch:1, no:"1.2", short:"კულტურის კერები",        name:"ქრისტიანული კულტურის კერები" },
  { ch:1, no:"1.3", short:"ჰაგიოგრაფია",            name:"ჰაგიოგრაფია და ჰიმნოგრაფია" },
  { ch:1, no:"1.4", short:"მწერლობის დასაწყისი",    name:"ქართული მწერლობის დასაწყისი" },
  { ch:1, no:"1.5", short:"ძველი ანბანი",           name:"ძველი ქართული ანბანის ასონიშნები" },
  { ch:2, no:"2.1", short:"ეპოქა და ისტორია",       name:"„შუშანიკის წამების“ ისტორიული ეპოქა" },
  { ch:2, no:"2.2", short:"ავტორი და ტექსტი",       name:"იაკობ ხუცესი და ტექსტი" },
  { ch:2, no:"2.3", short:"შუშანიკი და ვარსქენი",   name:"პერსონაჟები და მათი არჩევანი" },
  { ch:3, no:"3.1", short:"არაბეთის ეპოქა",         name:"არაბეთის სახალიფო აბოს ეპოქაში" },
  { ch:3, no:"3.2", short:"წელთაღრიცხვა",           name:"წელთაღრიცხვის სისტემები და თარიღი" },
  { ch:3, no:"3.3", short:"ავტორი და კომპოზიცია",   name:"იოვანე საბანისძე და ოთხთავიანი კომპოზიცია" },
  { ch:3, no:"3.4", short:"აბოს სახე",              name:"აბოს სახე და მეხსიერების ადგილები" },
  { ch:4, no:"4.1", short:"ტაო-კლარჯეთი",           name:"ტაო-კლარჯეთის აღმშენებლობა" },
  { ch:4, no:"4.2", short:"გრიგოლ ხანძთელი",        name:"გრიგოლ ხანძთელი და გიორგი მერჩულე" },
  { ch:4, no:"4.3", short:"მონასტერი — სკოლა",      name:"მონასტერი როგორც სასწავლებელი" },
  { ch:5, no:"5.1", short:"ივირონი და ათონელები",   name:"ათონის ივირონი, ექვთიმე და გიორგი" },
  { ch:5, no:"5.2", short:"ჰიმნოგრაფია",            name:"ქართული ჰიმნოგრაფია" },
  { ch:5, no:"5.3", short:"იოანე-ზოსიმე",           name:"იოანე-ზოსიმე — „ქებაჲ ქართულისა ენისაჲ“" },
];

const CARDS = [
  // ---------------- 1.1
  {t:"1.1", q:"რომელმა მოციქულებმა იქადაგეს ქრისტიანობა საქართველოში?", a:"<b>ანდრია პირველწოდებულმა, სიმონ კანანელმა, ბართლომემ და მატათიამ</b> — პირველ საუკუნეში."},
  {t:"1.1", q:"რატომ იწოდება საქართველო „სამოციქულოდ“?", a:"იმიტომ, რომ <b>მოციქულებმა მოიარეს და გააქრისტიანეს</b> დასავლეთი საქართველო."},
  {t:"1.1", q:"ვის სახელს უკავშირდება აღმოსავლეთ საქართველოს გაქრისტიანება?", a:"<b>წმინდა ნინოს</b> — მისი ქადაგება ირწმუნეს მირიან მეფემ და ნანა დედოფალმა."},
  {t:"1.1", q:"რომელ წელს გამოცხადდა ქრისტიანობა სახელმწიფო რელიგიად?", a:"<b>326 წელს.</b>"},
  {t:"1.1", q:"რა შემოიტანა ქრისტიანობამ ქართულ კულტურაში?", a:"<b>ზნეობრივი იდეალები</b>, ახლებური მსოფლმხედველობა, <b>განათლება</b>, საყოფაცხოვრებო წესები, <b>მწერლობის ჟანრები</b>, სატაძრო ხუროთმოძღვრება, ფრესკული ხელოვნება, ხატწერა, საგალობლები."},
  {t:"1.1", q:"რატომ ჰქონდა ქრისტიანობას უდიდესი მნიშვნელობა საქართველოსთვის?", a:"მან <b>დაიცვა ქვეყანა განსაცდელისგან</b> — მხნეობას მატებდა მამულის დასაცავად ბრძოლისას."},

  // ---------------- 1.2
  {t:"1.2", q:"რა იყო ქრისტიანული კულტურის კერები?", a:"<b>მონასტრები</b> ან მათთან არსებული <b>სასწავლებლები</b>."},
  {t:"1.2", q:"რა კეთდებოდა მონასტრებში?", a:"ითარგმნებოდა და მრავლდებოდა წიგნები, იქმნებოდა <b>ჰაგიოგრაფია და ჰიმნოგრაფია</b>, ასწავლიდნენ ბავშვებს, ავრცელებდნენ ქრისტიანობას."},
  {t:"1.2", q:"ვინ ააშენა სვეტიცხოველი და როდის?", a:"<b>მირიან მეფემ</b>, მეოთხე საუკუნეში."},
  {t:"1.2", q:"რა აღმოაჩინეს პეტრე იბერიელის მონასტრის გათხრისას?", a:"<b>422–423 წლებით დათარიღებული უძველესი ქართული წარწერა</b> — იუდას უდაბნოში, პალესტინაში."},
  {t:"1.2", q:"ვინ იყვნენ ასურელი მამები?", a:"<b>ცამეტი</b> სასულიერო მოღვაწე, რომლებიც <b>იოანე ზედაზნელის</b> მეთაურობით მოვიდნენ საქართველოში მეექვსე საუკუნეში."},
  {t:"1.2", q:"რომელი მონასტრები უკავშირდება ასურელ მამებს?", a:"ქაშვეთი, მამადავითი, ზედაზენი, შიომღვიმე, გარეჯა, სამთავისი, წილკანი, ალავერდი, ნეკრესი."},
  {t:"1.2", q:"სად გადაინაცვლა სამონასტრო მშენებლობის ცენტრმა მერვე საუკუნიდან?", a:"<b>სამხრეთ საქართველოში</b> — ხანძთა, შატბერდი, ზარზმა, პარეხი, მიძნაძორი, ბერთა; გრიგოლ ხანძთელისა და მისი მოწაფეების მიერ."},

  // ---------------- 1.3
  {t:"1.3", q:"რას ნიშნავს ტერმინი „ჰაგიოგრაფია“?", a:"ბერძნულიდან მოდის და ნიშნავს <b>„წმინდა ნაწერებს“</b>. ავტორს <b>ჰაგიოგრაფი</b> ეწოდება."},
  {t:"1.3", q:"რომელ ორ ნაწილად იყოფა ჰაგიოგრაფია?", a:"<b>„წამებანი“</b> (ანუ „მარტვილობანი“) და <b>„ცხოვრებანი“</b>."},
  {t:"1.3", q:"ვინ არიან „წამებათა“ მთავარი გმირები?", a:"<b>მოწამეები (მარტვილები)</b> — სიკვდილით დასჯილნი, რომლებიც თავიანთი სიცოცხლით ადასტურებდნენ ქრისტიანობის ჭეშმარიტებას."},
  {t:"1.3", q:"ვინ არიან „ცხოვრებათა“ მთავარი გმირები?", a:"<b>მოღვაწე წმინდანები.</b>"},
  {t:"1.3", q:"რომელი ჟანრია უფრო ძველი და რატომ?", a:"<b>„წამებანი“</b> — რადგან საწყის ეტაპზე ქრისტიანობა იდევნებოდა; მოგვიანებით, როცა სახელმწიფო რელიგია გახდა, გაჩნდა ინტერესი მოღვაწე წმინდანთა ცხოვრებისადმი."},
  {t:"1.3", q:"რა ორი თავისებურება აქვს ქართულ ჰაგიოგრაფიას?", a:"1) <b>„წამებათა“ ჟანრი არ შეწყვეტილა</b> მთელი შუა საუკუნეების მანძილზე;<br>2) ქართული ჰაგიოგრაფია <b>„ცხოვრების“ ჟანრით იწყება</b> („ნინოს ცხოვრება“), სხვა ქვეყნებისგან განსხვავებით."},
  {t:"1.3", q:"რას ნიშნავს „ჰიმნოგრაფია“?", a:"<b>სასულიერო პოეზია.</b> ბერძნ. „ჰიმნოს“ — ხოტბა, ქება, საგალობელი; „გრაფია“ — წერა."},
  {t:"1.3", q:"რით განსხვავდება ჰაგიოგრაფია ჰიმნოგრაფიისგან?", a:"ჰაგიოგრაფია <b>პროზაული</b> ჟანრია, ჰიმნოგრაფია კი <b>სასულიერო პოეზია</b>."},

  // ---------------- 1.4
  {t:"1.4", q:"რამდენი საუკუნე მოიცავს ძველი ქართული ლიტერატურა?", a:"<b>15 საუკუნე</b> — IV–V საუკუნეებიდან XVIII საუკუნის ჩათვლით."},
  {t:"1.4", q:"რომელი ორი თვალსაზრისი არსებობს ქართული მწერლობის დასაწყისზე?", a:"ერთნი მიიჩნევენ, რომ პირველი ძეგლი <b>წმინდა ნინოს ცხოვრებაა</b>, მეორენი — რომ <b>„შუშანიკის წამება“</b>."},
  {t:"1.4", q:"საიდან იყო წმინდა ნინო?", a:"<b>კაბადოკიელი ქალწული</b> — საქართველოში მეოთხე საუკუნის დასაწყისში შემოვიდა."},
  {t:"1.4", q:"რა ჰქვია წიგნს წმინდა ნინოს ცხოვრების შესახებ?", a:"<b>„მოქცევაჲ ქართლისაჲ“</b> — შეიქმნა მისი თანამგზავრი მორწმუნეების ჩანაწერებისგან."},
  {t:"1.4", q:"რა პრინციპით ისწავლება ძველი ქართული ლიტერატურა?", a:"<b>ქრონოლოგიური</b> — შექმნის დროის მიხედვით."},

  // ---------------- 1.5
  {t:"1.5", q:"როგორ იკითხება ჲ?", a:"<b>ი</b> — მოკლედ, სწრაფად.", ex:"ღმრთისაჲ → ღმრთისაი"},
  {t:"1.5", q:"როგორ იკითხება ჱ?", a:"<b>ეი</b> (ი მოკლედ).", ex:"ძჱ → ძეი"},
  {t:"1.5", q:"როგორ იკითხება ჳ?", a:"<b>ვი</b> ან <b>უი</b>.", ex:"თჳსით → თვისით"},
  {t:"1.5", q:"როგორ იკითხება ჴ?", a:"<b>ხ</b>.", ex:"ჴელი → ხელი"},
  {t:"1.5", q:"როგორ იკითხება ჵ და სად გვხვდება?", a:"<b>ჰოჲ</b> — წოდებით ბრუნვასთან.", ex:"ჵ კაცო! → ჰოი კაცო!"},

  // ---------------- 2.1
  {t:"2.1", q:"რომელ წლებს მოიცავს „შუშანიკის წამებაში“ აღწერილი მოვლენები?", a:"<b>467–476 წლებს</b> — ვარსქენის სპარსეთში გამგზავრებიდან შუშანიკის გარდაცვალებამდე."},
  {t:"2.1", q:"ვინ იყო ვარსქენი?", a:"<b>ქვემო ქართლის მმართველი (პიტიახში)</b>, შუშანიკის მეუღლე."},
  {t:"2.1", q:"რომელი ქართველი მეფის დროს ხდება მოქმედება?", a:"<b>ვახტანგ გორგასლის</b> — როცა იგი ეპოქალურ ცვლილებებს იწყებს."},
  {t:"2.1", q:"რა მსოფლიო მნიშვნელობის ძვრები ხდება ამ დროს?", a:"მთავრდება <b>ანტიკურობა</b> და იწყება <b>შუა საუკუნეები</b>; ეცემა დასავლეთ რომის იმპერია; იწყება <b>ხალხთა დიდი გადასახლება</b>; ჰუნები ატილას მეთაურობით აწიოკებენ ევრაზიას."},
  {t:"2.1", q:"რომელი მხარეები შემოიერთა ვახტანგ გორგასალმა?", a:"<b>ლაზიკა-ეგრისის ნაწილი, კლარჯეთი, კახეთი, ჰერეთი.</b>"},
  {t:"2.1", q:"რომელი ორიენტაცია აირჩია ვახტანგმა?", a:"<b>დასავლეთის</b> — ცოლად შეირთო ბიზანტიის იმპერატორის ასული ელენე და მცხეთიდან გააძევა ზოროასტრი ქურუმები."},
  {t:"2.1", q:"რომელი სარწმუნოება მიიღო ვარსქენმა?", a:"<b>მაზდეანობა</b> — სპარსეთში გავრცელებული ცეცხლთაყვანისმცემლობა."},
  {t:"2.1", q:"რა დაემართა ვარსქენს?", a:"შუშანიკის გარდაცვალებიდან <b>შვიდი წლის შემდეგ</b> ვახტანგ გორგასალმა შეიპყრო და <b>სიკვდილით დასაჯა</b>."},

  // ---------------- 2.2
  {t:"2.2", q:"ვინ არის „შუშანიკის წამების“ ავტორი?", a:"<b>იაკობ ხუცესი</b> — მომხდარი ამბების თვითმხილველი."},
  {t:"2.2", q:"რამდენი თავისგან შედგება „შუშანიკის წამება“?", a:"<b>15 თავისგან.</b>"},
  {t:"2.2", q:"რა ჟანრისაა „შუშანიკის წამება“?", a:"<b>ჰაგიოგრაფიული</b> ნაწარმოები, „წამების“ (მარტვილობის) ქვეჟანრისა."},
  {t:"2.2", q:"რატომ არის მნიშვნელოვანი, რომ ავტორი თვითმხილველი იყო?", a:"იმიტომ, რომ ტექსტი <b>უშუალო მოწმობაა</b> — ავტორი თავადვე მონაწილეობს მოვლენებში და პერსონაჟადაც გვევლინება."},
  {t:"2.2", q:"რა დაიზეპირა შუშანიკმა ციხეში ყოფნისას?", a:"<b>„დავითნი“</b> — დავით წინასწარმეტყველის ფსალმუნების წიგნი — და გალობდა."},

  // ---------------- 2.3
  {t:"2.3", q:"რა არჩევანის წინაშე დგას შუშანიკი?", a:"უნდა აირჩიოს <b>ოჯახსა და სიცოცხლეს</b> შორის ერთი მხრივ და <b>რწმენასა და ღირსებას</b> შორის — მეორე მხრივ."},
  {t:"2.3", q:"რით არის ვარსქენი შუშანიკის საპირისპირო სახე?", a:"ვარსქენმა <b>უარყო რწმენა</b> ძალაუფლებისა და ამბიციის გამო და მტრის სამსახურში ჩადგა; შუშანიკმა კი სიცოცხლის ფასად შეინარჩუნა."},
  {t:"2.3", q:"რას უპირისპირდება შუშანიკის არჩევანი პოლიტიკურად?", a:"ვარსქენის <b>ღალატს</b> — იგი ვახტანგ გორგასალს ღიად დაუპირისპირდა და სპარსეთის მხარე დაიჭირა."},
  {t:"2.3", q:"რომელ დედოფალს ადარებენ შუშანიკს?", a:"<b>ქეთევან დედოფალს</b> (XVII ს.) — ორივემ რწმენისთვის გაიღო მსხვერპლი, თუმცა სხვადასხვა ეპოქაში."},
  {t:"2.3", q:"რა იყო ამ ორი დედოფლის მთავარი იარაღი?", a:"არა ძალა, არამედ <b>ურყევი რწმენა და პირადი მაგალითი</b> — სწორედ ეს აძლევს საზოგადოებას ძალას განსაცდელის ჟამს."},

  // ---------------- 3.1
  {t:"3.1", q:"რომელ საუკუნეში ცხოვრობდა აბო?", a:"<b>VIII საუკუნის მეორე ნახევარში</b>; „აბოს წამება“ დაიწერა VIII საუკუნის მიწურულს."},
  {t:"3.1", q:"რომელმა დინასტიამ აიღო ხელში არაბეთის მართვა VIII საუკუნის შუა წლებში?", a:"<b>აბასიდებმა</b> — სათავეში იდგა აბას იბნ აბდ ალ-მუთალიბი, წინასწარმეტყველ მუჰამედის ბიძა."},
  {t:"3.1", q:"სად გადაიტანეს არაბებმა დედაქალაქი და როდის?", a:"<b>დამასკოდან ბაღდადში, 762 წელს</b> — დაახლოებით მაშინ, როცა აბო დაიბადა."},
  {t:"3.1", q:"რას უწოდეს ისტორიკოსებმა VIII საუკუნის მეორე ნახევარი?", a:"<b>„არაბული აღორძინების“</b> დასაწყისი."},
  {t:"3.1", q:"რომელი ტერმინები დაამკვიდრეს არაბებმა?", a:"<b>„ალგებრა“, „ციფრი“, „ალგორითმი“, „სინუსი“.</b>"},
  {t:"3.1", q:"რას ნიშნავს „ხალიფატი“ და „ხალიფა“?", a:"<b>ხალიფატი</b> (არაბ. „მემკვიდრეობა“) — დაპყრობითი ომებით შექმნილი სახელმწიფო; <b>ხალიფა</b> („მოადგილე“, „ნაცვალი“) — მისი მმართველი, მუჰამედის მოადგილე."},
  {t:"3.1", q:"რა ორი გადასახადი შემოიღეს არაბებმა?", a:"<b>„ჯიზია“</b> — სულადობრივი და <b>„ხარაჯა“</b> — მიწის გადასახადი."},
  {t:"3.1", q:"ვინ იყო თბილისის ამირა?", a:"<b>ბაღდადის ხალიფას წარმომადგენელი</b>, რომელიც მთელი ქართლის მმართველად მიიჩნეოდა."},
  {t:"3.1", q:"რა ხდებოდა ამ დროს ევროპაში?", a:"<b>კარლოს დიდი</b> ქმნის ფრანკთა იმპერიას; ბიზანტიაში <b>ხატმებრძოლეობაა</b>; სკანდინავიელი <b>ვიკინგები</b> თავს ესხმიან ევროპის სანაპიროებს."},

  // ---------------- 3.2
  {t:"3.2", q:"რომელი სამი წელთაღრიცხვის სისტემა იყო გავრცელებული ძველ საქართველოში?", a:"<b>„დასაბამიდან“</b> (ან „ადამს აქეთ“), <b>„ქრისტეს აქეთ“</b> და <b>ქორონიკონი</b>."},
  {t:"3.2", q:"რამდენი წელი გავიდა ადამის შექმნიდან ქრისტეს დაბადებამდე?", a:"<b>5604 წელი.</b>"},
  {t:"3.2", q:"როგორ გამოვითვალოთ „დასაბამიდან“ წელი?", a:"ჩვენი წელთაღრიცხვის წელს <b>მივუმატოთ 5604</b>.", ex:"შუშანიკი გარდაიცვალა 475 წელს → 475 + 5604 = 6079"},
  {t:"3.2", q:"როგორ გადავიყვანოთ „დასაბამიდან“ ჩვენს წელთაღრიცხვაზე?", a:"დასაბამის წელს <b>გამოვაკლოთ 5604</b>.", ex:"ვარსქენი დასაჯეს 6086 წელს → 6086 − 5604 = 482"},

  // ---------------- 3.3
  {t:"3.3", q:"ვინ არის „აბოს წამების“ ავტორი?", a:"<b>იოვანე საბანისძე.</b>"},
  {t:"3.3", q:"რა წყაროთი დგინდება ავტორის ვინაობა?", a:"<b>სამოელ ქართლის კათალიკოსის ეპისტოლით</b> — წერილით, რომლითაც მან იოვანე საბანისძეს სთხოვა აბოს წამების ამბის დაწერა."},
  {t:"3.3", q:"რამდენი თავისგან შედგება „აბოს წამება“?", a:"<b>ოთხი</b> თავისგან."},
  {t:"3.3", q:"ჩამოთვალე „აბოს წამების“ ოთხი თავი", a:"1. მოჴსენებაჲ წმიდისა ჰაბოჲსი<br>2. ქართლად შემოსლვაჲ და ნათლისღებაჲ<br>3. წამებაჲ წმიდისა ჰაბოჲსი<br>4. <b>ქებაჲ</b> წმიდისა მოწამისა ჰაბოჲსი"},
  {t:"3.3", q:"რით გამოირჩევა მეოთხე თავი?", a:"ეს არის <b>ერთ-ერთი პირველი ორიგინალური ქართული საგალობელი</b> — ჰიმნოგრაფიული ტექსტი თხრობის ნაცვლად."},

  // ---------------- 3.4
  {t:"3.4", q:"საიდან მოვიდა აბო საქართველოში?", a:"<b>არაბული სამყაროდან</b> — ბაღდადის ხალიფატიდან, ნერსე ერისთავთან ერთად."},
  {t:"3.4", q:"რით განსხვავდება აბოს არჩევანი შუშანიკისგან?", a:"შუშანიკი <b>ინარჩუნებს</b> მამაპაპურ რწმენას, აბო კი <b>სხვა სარწმუნოებიდან მოდის</b> და ქრისტიანობას შეგნებულად, საკუთარი ნებით ირჩევს."},
  {t:"3.4", q:"სად მოჰკვეთეს აბოს თავი?", a:"მტკვრის მარჯვენა სანაპიროზე, <b>ორმოცი სებასტიელი მოწამის მონასტრის</b> კარიბჭესთან ახლოს."},
  {t:"3.4", q:"რა ჰქვია დღეს ადგილს, რომელსაც სოღდებილი (საგოდებელი) ეწოდებოდა?", a:"<b>ევროპის მოედანი.</b>"},
  {t:"3.4", q:"როდის აშენდა აბო თბილელის ტაძარი?", a:"მშენებლობა დაიწყო <b>1996</b> და დასრულდა <b>2007</b> წელს; მასალად მტკვრის ხეობის ქვაა გამოყენებული."},
  {t:"3.4", q:"რა მოხდა გადმოცემით აბოს ნეშტთან?", a:"წმინდანის ძვლები <b>მდინარემ გამორიყა</b>, მოქალაქეებმა აკრიფეს და ნიშში შეინახეს."},

  // ---------------- 4.1
  {t:"4.1", q:"რატომ გაუდაბურდა ტაო-კლარჯეთი?", a:"<b>მურვან ყრუს შემოსევის</b> შემდეგ, რასაც <b>შავი ჭირის ეპიდემია</b> დაემატა — ყველაფერი განადგურდა."},
  {t:"4.1", q:"სად მდებარეობს ტაო-კლარჯეთი?", a:"<b>სამხრეთ-დასავლეთ საქართველოში</b> (ახლანდელი თურქეთის ტერიტორია)."},
  {t:"4.1", q:"სად გადაიტანა აშოტ კურაპალატმა სამეფო რეზიდენცია?", a:"<b>ციხე-ქალაქ არტანუჯში</b> — კლარჯეთის ცენტრში."},
  {t:"4.1", q:"რატომ იყო საჭირო ქართლის ნაცვალი ცენტრი?", a:"რადგან არაბებმა <b>თბილისზე კონტროლის დამყარებით</b> ქართლის სასიცოცხლო ენერგია დაიმორჩილეს და ქვეყანას მეთაური მხარე სჭირდებოდა."},
  {t:"4.1", q:"ვისი გეგმა იყო ტაო-კლარჯეთის აღდგენა?", a:"ისტორიკოსების აზრით, გეგმა შეიმუშავა <b>ნერსე ერისთავმა</b>, განხორციელება დაიწყო <b>გრიგოლ ხანძთელმა</b>, დააგვირგვინა კი <b>ბაგრატიონთა სამეფო სახლმა</b>."},
  {t:"4.1", q:"რა გზა გაიარა საქართველომ ტაო-კლარჯეთის შემდეგ?", a:"XI ს-ის დამდეგს <b>ბაგრატ III</b>-ის დროს გაერთიანდა; საუკუნის შემდეგ <b>დავით აღმაშენებელმა</b> გაათავისუფლა თბილისი; შემდეგ მოვიდა <b>თამარი</b> და დადგა „ოქროს ხანა“."},

  // ---------------- 4.2
  {t:"4.2", q:"ვინ არის „გრიგოლ ხანძთელის ცხოვრების“ ავტორი?", a:"<b>გიორგი მერჩულე.</b>"},
  {t:"4.2", q:"რა უწოდა გიორგი მერჩულემ გრიგოლ ხანძთელს?", a:"<b>„უდაბნოთა ქალაქმყოფელი“</b> — ვინც გაუდაბურებულ ადგილას დასახლებები გააშენა და „ზეციურ ქალაქად“ აქცია."},
  {t:"4.2", q:"რამდენი თავისგან შედგება „გრიგოლ ხანძთელის ცხოვრება“?", a:"<b>19 თავისგან.</b>"},
  {t:"4.2", q:"რა ჟანრისაა „გრიგოლ ხანძთელის ცხოვრება“?", a:"ჰაგიოგრაფიული ნაწარმოები, <b>„ცხოვრების“</b> ქვეჟანრისა — მთავარი გმირი მოღვაწე წმინდანია, არა მოწამე."},
  {t:"4.2", q:"რა არის ლიტერატურული დღიური?", a:"<b>პირადი ჩანაწერი წაკითხულ ტექსტზე</b> — რას გრძნობ, როგორ ფიქრობ და აანალიზებ; არა მხოლოდ შინაარსის გადმოცემა."},
  {t:"4.2", q:"რომელი თანამედროვე მწერლის ტექსტი ეხმიანება გრიგოლ ხანძთელის სახეს?", a:"<b>ლევან გოთუას</b> მოთხრობა — სადაც საუკუნეების შემდეგ ხანძთაში განმარტოებული ბერია გამოყვანილი."},

  // ---------------- 4.3
  {t:"4.3", q:"რას ასწავლიდნენ გრიგოლ ხანძთელის მონასტრებში?", a:"<b>წერა-კითხვას, კალიგრაფიას, რიტორიკას, ფილოსოფიას, ისტორიას, მუსიკას, მხატვრობას, ხუროთმოძღვრებას, მშენებლობას, მიწათმოქმედებას, მევენახეობას.</b>"},
  {t:"4.3", q:"რატომ არ აშენებდა გრიგოლი მონასტრებს მხოლოდ წირვა-ლოცვისთვის?", a:"რადგან საქართველო ჯერ <b>კულტურულად და ეკონომიკურად</b> უნდა გაძლიერებულიყო, შემდეგ გაერთიანებულიყო და მერე ეფიქრა დამოუკიდებლობაზე."},
  {t:"4.3", q:"რომელი მონასტრები დააარსა გრიგოლ ხანძთელმა და მისმა მოწაფეებმა?", a:"<b>ხანძთა, შატბერდი, ზარზმა, პარეხი, მიძნაძორი, ბერთა</b> და სხვა."},

  // ---------------- 5.1
  {t:"5.1", q:"როდის აშენდა ათონის ქართველთა მონასტერი?", a:"<b>980–983 წლებში</b> — ბარდა სკლიაროსის დამარცხების შემდეგ."},
  {t:"5.1", q:"სად მდებარეობს ივირონი?", a:"<b>საბერძნეთში</b>, ქალკედონის ნახევარკუნძულზე, <b>ათონის მთაზე</b> (მთაწმინდაზე)."},
  {t:"5.1", q:"რას ნიშნავს „ივირონი“?", a:"<b>„ქართველთა“</b> — ასე უწოდებენ ბერძნები ამ მონასტერს."},
  {t:"5.1", q:"როგორ შეაფასა კორნელი კეკელიძემ ივირონის მნიშვნელობა?", a:"„<b>არც ერთ სამონასტრო დაწესებულებას ისეთი მნიშვნელობა არ ჰქონია</b> ჩვენი მწერლობისა და კულტურის ისტორიაში, როგორიც ათონის ივერიის მონასტერს.“"},
  {t:"5.1", q:"რომელი აკაკის ნაწარმოებიდან იცით ივირონის ისტორია?", a:"<b>„თორნიკე ერისთავიდან“.</b>"},
  {t:"5.1", q:"ექვთიმე ათონელი — რა წლებში ცხოვრობდა?", a:"<b>955–1028</b> — მწერალი, მთარგმნელი, ფილოსოფოსი, კალიგრაფი, ივირონის წინამძღვარი."},
  {t:"5.1", q:"ვინ იყო ექვთიმეს მამა?", a:"<b>იოანე</b> — დავით კურაპალატის კარზე მიღებული დიდგვაროვანი, რომელმაც დააფუძნა ღვთისმშობლის სახელობის ქართველთა მონასტერი ათონზე."},
  {t:"5.1", q:"რატომ არ იცოდა ექვთიმემ ქართული კარგად?", a:"<b>საბერძნეთში იზრდებოდა</b> — ქართველ უფლისწულებთან ერთად მძევლად იყო ბიზანტიის სამეფო კარზე."},
  {t:"5.1", q:"რა გადმოცემა არსებობს ექვთიმეზე?", a:"მძიმედ დაავადებულს გამოეცხადა <b>ღვთისმშობელი</b> და ქართულად მიმართა; ამის შემდეგ ექვთიმე თავანკარა ქართულით ალაპარაკდა და დაიწყო წიგნების წერა-თარგმნა."},
  {t:"5.1", q:"რა შექმნეს ექვთიმე და გიორგი მთაწმინდელებმა?", a:"<b>ახალი ენობრივი სტილი</b>, რომელმაც ქართული სალიტერატურო ენა წარმოუდგენელ სიმაღლემდე აიყვანა — დღეს ეკლესიაში სახარება მათი ქართულით იკითხება."},
  {t:"5.1", q:"რა დაემართა ივირონს?", a:"<b>XIII საუკუნიდან</b> ბერძენი ბერები გააქტიურდნენ და დროთა განმავლობაში მთლიანად დაეპატრონენ; დღემდე იქ უნიკალური ქართული ბიბლიოთეკაა."},

  // ---------------- 5.2
  {t:"5.2", q:"რა იყო ჰიმნების შექმნის ძირითადი მიზანი?", a:"<b>უფლისა და ღვთისმშობლის განდიდება</b> გალობით; მოგვიანებით — წმინდანთა გმირობისა და ღვაწლის ქება."},
  {t:"5.2", q:"რატომ არ აქვს ჰიმნს ხშირად რითმა და თანაბარი მარცვლები?", a:"რადგან ჰიმნოგრაფებისთვის მთავარი იყო <b>საგალობლის მელოდია</b>, არა ლექსის ფორმა."},
  {t:"5.2", q:"რა წიგნი იგალობებოდა თავდაპირველად ეკლესიებში?", a:"<b>დავით წინასწარმეტყველის ფსალმუნები</b> — ქართულად „დავითნი“."},
  {t:"5.2", q:"ვინ დაიზეპირა „დავითნი“ წიგნის პერსონაჟთაგან?", a:"<b>შუშანიკმა</b> ციხეში; <b>აბომ</b> გაქრისტიანებისთანავე; <b>გრიგოლ ხანძთელმა</b> ბავშვობიდანვე."},
  {t:"5.2", q:"რა ჰქვია გრიგოლ ხანძთელის საგალობელთა კრებულს?", a:"<b>საწელიწდო იადგარი</b> — მასში შევიდა როგორც ორიგინალური ჰიმნები, ისე თარგმანები."},
  {t:"5.2", q:"რომელი საგალობელი მიიჩნევა გრიგოლ ხანძთელისად?", a:"<b>„გალობანი გიორგისნი“ (იამბიკონი)</b> — წმინდა გიორგისადმი მიძღვნილი."},
  {t:"5.2", q:"რა არის იამბიკო?", a:"<b>ხუთსტრიქონიანი სტროფებისგან შედგენილი საგალობელი</b>; იამბიკონი — იამბიკოთა კრებული."},
  {t:"5.2", q:"ვინ უწოდა „გალობანი გიორგისნს“ „ნამდვილი პოეტური შედევრი“?", a:"<b>პავლე ინგოროყვამ.</b>"},
  {t:"5.2", q:"ჩამოთვალე ცნობილი ქართველი ჰიმნოგრაფები", a:"<b>მიქაელ მოდრეკილი, იოანე მინჩხი, იოანე-ზოსიმე, სტეფანე ჭყონდიდელი, დემეტრე I</b> და სხვები."},

const KEY = 'mzia-cards-lit9-v1';
const TOPIC_OF = {};
TOPICS.forEach(t => TOPIC_OF[t.no] = t);
CARDS.forEach((c, n) => { c.id = n; c.ch = TOPIC_OF[c.t].ch; });

QUIZ.forEach((q, n) => { q.id = n; q.ch = TOPIC_OF[q.t].ch; });

const ALL_TOPICS = TOPICS.map(t => t.no);
const countOf = {}, quizCountOf = {};
ALL_TOPICS.forEach(n => {
  countOf[n] = CARDS.filter(c => c.t === n).length;
  quizCountOf[n] = QUIZ.filter(q => q.t === n).length;
});
const cntOf = n => (mode === 'quiz' ? quizCountOf[n] : countOf[n]);
const unitWord = () => (mode === 'quiz' ? 'კითხვა' : 'ბარათი');

function shuffle(a){
  a = a.slice();
  for (let k = a.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    const tmp = a[k]; a[k] = a[j]; a[j] = tmp;
  }
  return a;
}

/* picked — მონიშნული თემების სია (ყოველთვის სრული ჭეშმარიტება) */
let picked = ALL_TOPICS.slice();
let known = {};
let openFilter = false;
let mode = 'cards';
let i = 0, flipped = false;
/* ტესტის მდგომარეობა */
let qList = [], qPos = 0, qChosen = null, qScore = 0, qOptOrder = [0,1,2,3];

try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const s = JSON.parse(raw);
    if (Array.isArray(s.picked) && s.picked.length) {
      const ok = s.picked.filter(n => ALL_TOPICS.indexOf(n) > -1);
      if (ok.length) picked = ok;
    }
    if (s.known && typeof s.known === 'object') known = s.known;
    if (s.mode === 'quiz' || s.mode === 'cards') mode = s.mode;
  }
} catch (e) {}

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify({ picked: picked, known: known, mode: mode }));
  } catch (e) {}
}

const topicsOfCh = no => TOPICS.filter(t => t.ch === no).map(t => t.no);
const chPicked  = no => topicsOfCh(no).every(n => picked.indexOf(n) > -1);
const chPartial = no => !chPicked(no) && topicsOfCh(no).some(n => picked.indexOf(n) > -1);
const selectedCards = () => CARDS.filter(c => picked.indexOf(c.t) > -1);
const selectedQuiz  = () => QUIZ.filter(q => picked.indexOf(q.t) > -1);

function startQuiz(){
  qList = shuffle(selectedQuiz());
  qPos = 0; qChosen = null; qScore = 0;
  qOptOrder = shuffle([0,1,2,3]);
}
function chooseOpt(k){
  if (qChosen !== null) return;
  qChosen = k;
  if (k === qList[qPos].c) qScore++;
  render();
}
function nextQuestion(){
  qPos++; qChosen = null; qOptOrder = shuffle([0,1,2,3]); render();
}
function setMode(m){
  if (mode === m) return;
  mode = m;
  if (m === 'quiz') startQuiz(); else { i = 0; flipped = false; }
  save(); render();
}

function setPicked(list){
  picked = list.length ? list : ALL_TOPICS.slice();
  i = 0; flipped = false;
  if (mode === 'quiz') startQuiz();
  save(); render();
}
function toggleTopic(no){
  const on = picked.indexOf(no) > -1;
  setPicked(on ? picked.filter(x => x !== no) : ALL_TOPICS.filter(x => picked.indexOf(x) > -1 || x === no));
}
function toggleChapter(no){
  const mine = topicsOfCh(no);
  if (chPicked(no)) setPicked(picked.filter(x => mine.indexOf(x) < 0));
  else setPicked(ALL_TOPICS.filter(x => picked.indexOf(x) > -1 || mine.indexOf(x) > -1));
}
function onlyChapter(no){ setPicked(topicsOfCh(no)); }
function markKnown(id){ known[id] = 1; flipped = false; save(); render(); }
function resetSelection(){
  selectedCards().forEach(c => { delete known[c.id]; });
  i = 0; flipped = false; save(); render();
}
function go(step){ i += step; flipped = false; render(); }
function doFlip(){
  flipped = !flipped;
  const f = document.querySelector('.flip');
  if (f) f.classList.toggle('on', flipped);
}

/* ---------- ფილტრის წარწერა ---------- */
function filterLabel(){
  const n = (mode === 'quiz' ? selectedQuiz() : selectedCards()).length;
  const u = ' ' + unitWord();
  if (picked.length === ALL_TOPICS.length) return ['სრული მასალა', n + u + ' · ყველა თავი და თემა'];
  const chs = CHAPTERS.filter(c => chPicked(c.no) && !chPartial(c.no)).map(c => 'თავი ' + c.no);
  const onlyWhole = CHAPTERS.every(c => chPicked(c.no) || topicsOfCh(c.no).every(x => picked.indexOf(x) < 0));
  if (onlyWhole && chs.length) return [chs.join(' + '), n + u];
  if (picked.length === 1){
    const t = TOPIC_OF[picked[0]];
    return [t.no + ' ' + t.short, n + u + ' · თავი ' + t.ch];
  }
  return [picked.length + ' თემა არჩეული', n + u];
}

/* ---------- ფილტრის პანელი ---------- */
function renderPanel(){
  const p = document.getElementById('panel');
  p.hidden = !openFilter;
  document.getElementById('fbArrow').textContent = openFilter ? '▴' : '▾';
  if (!openFilter) { p.innerHTML = ''; return; }
  p.innerHTML = '';

  const h1 = document.createElement('h3');
  h1.textContent = 'თავები';
  p.appendChild(h1);

  CHAPTERS.forEach(c => {
    const on = chPicked(c.no), part = chPartial(c.no);
    const r = document.createElement('div');
    r.className = 'row ch' + (on ? ' on' : '');
    r.innerHTML = '<span class="box">' + (on ? '✓' : (part ? '–' : '')) + '</span>'
      + '<span class="lbl">თავი ' + c.no + '<span class="sub">' + c.name + '</span></span>'
      + '<span class="n">' + (mode === 'quiz' ? QUIZ : CARDS).filter(x => x.ch === c.no).length + '</span>';
    if (part) r.querySelector('.box').style.color = 'rgba(27,36,56,.5)';
    r.onclick = () => toggleChapter(c.no);
    p.appendChild(r);
  });

  const h2 = document.createElement('h3');
  h2.className = 'mt';
  h2.textContent = 'თემები';
  p.appendChild(h2);

  TOPICS.forEach(t => {
    const on = picked.indexOf(t.no) > -1;
    const r = document.createElement('div');
    r.className = 'row' + (on ? ' on' : '');
    r.innerHTML = '<span class="box">' + (on ? '✓' : '') + '</span>'
      + '<span class="lbl">' + t.no + ' · ' + t.short
      + '<span class="sub">თავი ' + t.ch + '</span></span>'
      + '<span class="n">' + cntOf(t.no) + '</span>';
    r.onclick = () => toggleTopic(t.no);
    p.appendChild(r);
  });

  const btns = document.createElement('div');
  btns.className = 'pbtns';
  const mk = (txt, cls, fn) => {
    const b = document.createElement('button');
    b.className = 'pbtn ' + cls; b.type = 'button'; b.textContent = txt; b.onclick = fn;
    return b;
  };
  CHAPTERS.forEach(c => btns.appendChild(
    mk('მხოლოდ თავი ' + c.no, '', () => onlyChapter(c.no))));
  if (CHAPTERS.length % 2 === 1) btns.appendChild(mk('ყველაფერი', 'full', () => setPicked(ALL_TOPICS.slice())));
  else btns.appendChild(mk('ყველაფერი', '', () => setPicked(ALL_TOPICS.slice())));
  btns.appendChild(mk('✓ მზადაა', 'fill full', () => { openFilter = false; render(); }));
  p.appendChild(btns);
}

/* ---------- ბარათები ---------- */
function render(){
  const lbl = filterLabel();
  document.getElementById('fbT1').textContent = lbl[0];
  document.getElementById('fbT2').textContent = lbl[1];
  renderPanel();

  document.getElementById('modeCards').className = 'mode' + (mode === 'cards' ? ' on' : '');
  document.getElementById('modeQuiz').className  = 'mode' + (mode === 'quiz'  ? ' on' : '');

  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (openFilter) return;
  if (mode === 'quiz') { renderQuiz(stage); return; }

  const sel = selectedCards();
  const queue = sel.filter(c => !known[c.id]);
  const knownN = sel.length - queue.length;

  if (sel.length === 0){
    stage.innerHTML = '<div class="empty">ბარათი არ არის — ფილტრში აირჩიე თავი ან თემა.</div>';
    return;
  }

  if (queue.length === 0){
    const d = document.createElement('div');
    d.className = 'done';
    d.innerHTML = '<div class="big">🏆</div><h2>ყველა ბარათი იცი!</h2>'
      + '<p>' + sel.length + ' ბარათი სრულად გაიარე. გაიმეორე თავიდან, რომ კარგად დაიმახსოვრო.</p>';
    const b = document.createElement('button');
    b.className = 'btn good wide'; b.type = 'button';
    b.textContent = '🔄 თავიდან გავიმეორო';
    b.onclick = resetSelection;
    d.appendChild(b);
    stage.appendChild(d);
    return;
  }

  const idx = ((i % queue.length) + queue.length) % queue.length;
  const card = queue[idx];
  const topic = TOPIC_OF[card.t];

  const cnt = document.createElement('div');
  cnt.className = 'counter';
  cnt.textContent = (idx + 1) + ' / ' + queue.length + '  ·  ✓ ვიცი ' + knownN + ' / ' + sel.length;
  stage.appendChild(cnt);

  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + (knownN / sel.length * 100) + '%"></i>';
  stage.appendChild(bar);

  const flip = document.createElement('div');
  flip.className = 'flip' + (flipped ? ' on' : '');
  flip.innerHTML =
    '<div class="inner">'
    + '<div class="face"><div class="tag"></div><div class="q"></div>'
    +   '<div class="tip">👆 დააჭირე ბარათს — პასუხი გამოჩნდება</div></div>'
    + '<div class="face back"><div class="tag"></div><div class="a"></div>'
    +   '<div class="ex"></div><div class="tip">👆 დააჭირე — ისევ კითხვა</div></div>'
    + '</div>';
  const label = 'თავი ' + topic.ch + ' · ' + topic.no + ' ' + topic.short;
  flip.querySelectorAll('.tag').forEach(el => el.textContent = label);
  flip.querySelector('.q').textContent = card.q;
  flip.querySelector('.a').innerHTML = card.a;
  const ex = flip.querySelector('.ex');
  if (card.ex) ex.innerHTML = '„' + card.ex + '“'; else ex.remove();
  stage.appendChild(flip);

  let t0 = null, usedTouch = false;
  flip.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; t0 = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  flip.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    t0 = null; usedTouch = true;
    setTimeout(() => usedTouch = false, 500);
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) doFlip();
  });
  flip.addEventListener('click', () => { if (!usedTouch) doFlip(); });

  const nav = document.createElement('div');
  nav.className = 'nav';
  const mkb = (txt, cls, fn) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls; b.type = 'button'; b.textContent = txt; b.onclick = fn;
    return b;
  };
  nav.appendChild(mkb('← წინა', 'light', () => go(-1)));
  nav.appendChild(mkb('✓ ვიცი', 'good', () => markKnown(card.id)));
  nav.appendChild(mkb('შემდეგი →', 'light', () => go(1)));
  stage.appendChild(nav);

  if (knownN > 0){
    const r = document.createElement('button');
    r.className = 'btn wide'; r.type = 'button';
    r.textContent = '🔄 მონიშვნების გასუფთავება (' + knownN + ')';
    r.onclick = resetSelection;
    stage.appendChild(r);
  }
}

/* ---------- ტესტი ---------- */
const LETTERS = ['ა', 'ბ', 'გ', 'დ'];

function renderQuiz(stage){
  if (qList.length === 0) startQuiz();

  if (selectedQuiz().length === 0){
    stage.innerHTML = '<div class="empty">ამ არჩევანზე ტესტის კითხვა არ არის — ფილტრში აირჩიე სხვა თავი ან თემა.</div>';
    return;
  }

  // --- შედეგის ეკრანი
  if (qPos >= qList.length){
    const pct = Math.round(qScore / qList.length * 100);
    const face = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '💪' : '📚';
    const word = pct >= 90 ? 'ბრწყინვალედ!' : pct >= 70 ? 'ძალიან კარგი!'
               : pct >= 50 ? 'კარგია, გაიმეორე!' : 'ჯერ ბარათები გაიარე და სცადე ისევ.';
    const d = document.createElement('div');
    d.className = 'done';
    d.innerHTML = '<div class="big">' + face + '</div>'
      + '<h2>' + qScore + ' / ' + qList.length + ' — ' + pct + '%</h2>'
      + '<p>' + word + '</p>';
    const b = document.createElement('button');
    b.className = 'btn good wide'; b.type = 'button'; b.textContent = '🔄 ტესტი თავიდან';
    b.onclick = () => { startQuiz(); render(); };
    d.appendChild(b);
    const b2 = document.createElement('button');
    b2.className = 'btn wide'; b2.type = 'button'; b2.textContent = '🎴 ბარათებზე გადასვლა';
    b2.onclick = () => setMode('cards');
    d.appendChild(b2);
    stage.appendChild(d);
    return;
  }

  const item = qList[qPos];
  const topic = TOPIC_OF[item.t];

  const sc = document.createElement('div');
  sc.className = 'score';
  sc.innerHTML = '<span>კითხვა ' + (qPos + 1) + ' / ' + qList.length + '</span>'
               + '<span>✓ სწორი: ' + qScore + '</span>';
  stage.appendChild(sc);

  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + (qPos / qList.length * 100) + '%"></i>';
  stage.appendChild(bar);

  const box = document.createElement('div');
  box.className = 'qbox';
  box.innerHTML = '<div class="tagq"></div><div class="qt"></div>';
  box.querySelector('.tagq').textContent =
    'თავი ' + topic.ch + ' · ' + topic.no + ' ' + topic.short;
  box.querySelector('.qt').textContent = item.q;
  stage.appendChild(box);

  const opts = document.createElement('div');
  opts.className = 'opts';
  qOptOrder.forEach((origIdx, shown) => {
    const b = document.createElement('button');
    b.type = 'button';
    let cls = 'opt';
    if (qChosen !== null){
      b.disabled = true;
      if (origIdx === item.c) cls += ' ok';
      else if (origIdx === qChosen) cls += ' bad';
      else cls += ' dim';
    }
    b.className = cls;
    b.innerHTML = '<span class="let">' + LETTERS[shown] + '</span><span class="ot"></span>';
    b.querySelector('.ot').textContent = item.o[origIdx];
    b.onclick = () => chooseOpt(origIdx);
    opts.appendChild(b);
  });
  stage.appendChild(opts);

  if (qChosen !== null){
    const fb = document.createElement('div');
    const right = qChosen === item.c;
    fb.className = 'fb ' + (right ? 'ok' : 'bad');
    fb.textContent = right ? '✓ სწორია!' : '✗ სწორი პასუხი: ' + item.o[item.c];
    stage.appendChild(fb);

    const nb = document.createElement('button');
    nb.className = 'btn good wide'; nb.type = 'button';
    nb.textContent = (qPos + 1 >= qList.length) ? 'შედეგის ნახვა →' : 'შემდეგი კითხვა →';
    nb.onclick = nextQuestion;
    stage.appendChild(nb);
  }
}

document.getElementById('filterbtn').onclick = () => { openFilter = !openFilter; render(); };
document.getElementById('modeCards').onclick = () => setMode('cards');
document.getElementById('modeQuiz').onclick  = () => setMode('quiz');

document.addEventListener('keydown', e => {
  if (openFilter) return;
  if (mode === 'quiz'){
    const n = ['1','2','3','4'].indexOf(e.key);
    if (n > -1 && qChosen === null && qPos < qList.length){
      chooseOpt(qOptOrder[n]);
    } else if ((e.key === 'Enter' || e.key === ' ') && qChosen !== null){
      e.preventDefault(); nextQuestion();
    }
    return;
  }
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); doFlip(); }
});

if (mode === 'quiz') startQuiz();
render();
</script>
</body>
</html>
