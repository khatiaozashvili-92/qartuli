<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFC93C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="ქართული ლიტერატურა VII კლასი — სასწავლო ბარათები და ტესტები თავების მიხედვით.">
<title>ბარათები — ქართული ლიტერატურა VII</title>
<style>
  :root{
    --yellow:#FFC93C; --ink:#1b2438; --card:#ffffff;
    --soft:rgba(27,36,56,.08); --soft2:rgba(27,36,56,.18);
    --good:#1f8a5b; --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--yellow); color:var(--ink);
    font-family:"Segoe UI","Sylfaen",system-ui,-apple-system,sans-serif;
    line-height:1.5; padding:0 14px;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{max-width:430px;margin:0 auto;padding-block:14px 30px}

  .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .home{font-size:13px;color:var(--ink);text-decoration:none;opacity:.75;font-weight:600;flex:none}
  .home:hover{opacity:1}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px}
  .book{font-size:12.5px;opacity:.7;margin:2px 0 12px}

  /* ---------- ფილტრის ღილაკი ---------- */
  .filterbtn{width:100%;display:flex;align-items:center;gap:10px;
             background:var(--card);border:2px solid var(--ink);border-radius:15px;
             padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;
             box-shadow:0 3px 0 rgba(27,36,56,.14)}
  .filterbtn .ico{font-size:17px;flex:none}
  .filterbtn .txt{flex:1;min-width:0}
  .filterbtn .t1{font-size:14px;font-weight:800;line-height:1.25}
  .filterbtn .t2{font-size:11.5px;opacity:.7;font-weight:600;line-height:1.3}
  .filterbtn .arrow{flex:none;font-size:13px;opacity:.6;font-weight:800}

  /* ---------- ფილტრის პანელი ---------- */
  .panel{background:var(--card);border-radius:var(--radius);margin-top:9px;padding:14px 14px 12px;
         box-shadow:0 5px 0 rgba(27,36,56,.14), 0 12px 26px rgba(27,36,56,.14)}
  .panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;opacity:.55;
            margin:0 0 7px;font-weight:800}
  .panel h3.mt{margin-top:14px}
  .row{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;
       font:inherit;color:var(--ink);padding:9px 8px;border-radius:11px;cursor:pointer;text-align:left}
  .row:hover{background:#faf8f3}
  .row + .row{border-top:1px solid rgba(27,36,56,.07)}
  .box{flex:none;width:21px;height:21px;border:2px solid var(--soft2);border-radius:6px;
       display:grid;place-items:center;font-size:13px;font-weight:900;color:transparent}
  .row.on .box{background:var(--ink);border-color:var(--ink);color:var(--yellow)}
  .row .lbl{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.3}
  .row .sub{font-size:11.5px;font-weight:600;opacity:.6;display:block}
  .row .n{flex:none;font-size:12px;font-weight:700;opacity:.55}
  .row.ch .lbl{font-size:14.5px;font-weight:800}

  .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
  .pbtn{border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;
        font-size:13px;font-weight:700;padding:11px 6px;border-radius:12px;cursor:pointer}
  .pbtn.fill{background:var(--ink);color:var(--yellow)}
  .pbtn.full{grid-column:1 / -1}

  /* ---------- რეჟიმები ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0 0}
  .mode{border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;
        font-size:14px;font-weight:800;padding:11px 6px;border-radius:14px;cursor:pointer}
  .mode.on{background:var(--ink);color:var(--yellow)}

  /* ---------- ტესტი ---------- */
  .qbox{background:var(--card);border-radius:var(--radius);padding:26px 18px;
        box-shadow:0 6px 0 rgba(27,36,56,.14), 0 14px 30px rgba(27,36,56,.14);
        text-align:center;margin-bottom:11px}
  .qbox .tagq{font-size:10.5px;font-weight:800;opacity:.5;margin-bottom:10px;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qbox .qt{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:11px;width:100%;background:var(--card);
       border:2px solid var(--soft2);border-radius:14px;padding:13px 14px;font:inherit;
       font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;
       box-shadow:0 3px 0 rgba(27,36,56,.1)}
  .opt .let{flex:none;width:24px;height:24px;border-radius:8px;background:var(--soft);
            display:grid;place-items:center;font-size:12.5px;font-weight:800}
  .opt .ot{flex:1;min-width:0}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:#1f8a5b;background:#e8f6ee}
  .opt.ok .let{background:#1f8a5b;color:#fff}
  .opt.bad{border-color:#c0392b;background:#fdecea}
  .opt.bad .let{background:#c0392b;color:#fff}
  .opt.dim{opacity:.45}
  .fb{text-align:center;font-size:14px;font-weight:800;margin-top:11px}
  .fb.ok{color:#15704a}
  .fb.bad{color:#a5281b}
  .score{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:11px;
         display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;
         box-shadow:0 3px 0 rgba(27,36,56,.1)}

  /* ---------- მრიცხველი ---------- */
  .counter{font-size:12.5px;font-weight:700;opacity:.85;text-align:center;margin:14px 0 6px}
  .bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:12px}
  .bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}

  /* ---------- ბარათი ---------- */
  .flip{perspective:1200px;cursor:pointer;margin-bottom:12px}
  .inner{position:relative;transform-style:preserve-3d;
         transition:transform .45s cubic-bezier(.4,.1,.2,1);min-height:330px}
  .flip.on .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        background:var(--card);border-radius:var(--radius);padding:34px 20px 44px;
        box-shadow:0 6px 0 rgba(27,36,56,.14), 0 14px 30px rgba(27,36,56,.14);
        display:flex;flex-direction:column;justify-content:center;align-items:center;
        text-align:center;overflow-y:auto}
  .face.back{transform:rotateY(180deg)}
  .tag{position:absolute;top:11px;left:14px;right:14px;font-size:10.5px;font-weight:800;
       opacity:.5;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q{font-size:19.5px;font-weight:700;letter-spacing:-.2px}
  .a{font-size:17px;font-weight:600}
  .a b{background:#FFF0BE;padding:0 3px;border-radius:4px}
  .ex{font-size:14px;opacity:.75;margin-top:10px;font-weight:500}
  .tip{position:absolute;bottom:13px;left:0;right:0;font-size:11.5px;opacity:.5;font-weight:600}

  /* ---------- ნავიგაცია ---------- */
  .nav{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:7px}
  .btn{border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;
       font-size:14px;font-weight:700;padding:13px 6px;border-radius:14px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.good{background:var(--ink);color:var(--yellow)}
  .btn.wide{width:100%;margin-top:10px;padding:13px}
  .btn.light{background:var(--card)}

  .done{background:var(--card);border-radius:var(--radius);padding:30px 22px;text-align:center;
        box-shadow:0 6px 0 rgba(27,36,56,.14), 0 14px 30px rgba(27,36,56,.14)}
  .done .big{font-size:42px;line-height:1}
  .done h2{font-size:19px;margin:12px 0 6px}
  .done p{font-size:14px;opacity:.8;margin:0}
  .empty{background:var(--card);border-radius:var(--radius);padding:26px 20px;text-align:center;
         font-size:14.5px;box-shadow:0 6px 0 rgba(27,36,56,.14)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>ბარათები 🎴</h1>
    <a class="home" href="../">← ყველა წიგნი</a>
  </div>
  <p class="book">ქართული ლიტერატურა VII · მოსწავლის წიგნი, I ნაწილი</p>

  <button class="filterbtn" id="filterbtn" type="button">
    <span class="ico">⚙️</span>
    <span class="txt"><span class="t1" id="fbT1"></span><span class="t2" id="fbT2"></span></span>
    <span class="arrow" id="fbArrow">▾</span>
  </button>

  <div class="panel" id="panel" hidden></div>

  <div class="modes" id="modes">
    <button class="mode on" id="modeCards" type="button">🎴 ბარათები</button>
    <button class="mode" id="modeQuiz" type="button">✍️ ტესტი</button>
  </div>

  <div id="stage"></div>
</div>

<script>
/* ============================== მასალა წიგნიდან ============================== */
const CHAPTERS = [
  { no: 1, name: "სამშობლო, უპირველეს ყოვლისა!" },
  { no: 2, name: "ცოდნის გზაზე" },
  { no: 3, name: "ადამიანის არჩევანი" },
];

const TOPICS = [
  { ch:1, no:"1.1", short:"ლიტერატურული საღამო",   name:"ნიკო ლორთქიფანიძე — „ლიტერატურული საღამო“" },
  { ch:1, no:"1.2", short:"გამარჯობა, აფხაზეთო",   name:"გალაკტიონ ტაბიძე — „გამარჯობა, აფხაზეთო, შენი!“" },
  { ch:1, no:"1.3", short:"საქართველოში",          name:"ლადო ასათიანი — „საქართველოში“" },
  { ch:1, no:"1.4", short:"ბაზალეთის ტბა",         name:"ილია ჭავჭავაძე — „ბაზალეთის ტბა“" },
  { ch:1, no:"1.5", short:"ხატის წინ",             name:"აკაკი წერეთელი — „ხატის წინ“" },
  { ch:1, no:"1.6", short:"საქართველოო ლამაზო",    name:"ანა კალანდაძე — „საქართველოო ლამაზო“" },
  { ch:2, no:"2.1", short:"სწავლა მოსწავლეთა",     name:"დავით გურამიშვილი — „სწავლა მოსწავლეთა“" },
  { ch:2, no:"2.2", short:"ილიას საჯარო სიტყვა",   name:"ილია ჭავჭავაძე — სიტყვა წინამძღვრიანთკარის სკოლის გახსნაზე" },
  { ch:2, no:"2.3", short:"ჩემი ცხოვრების გზაზე",  name:"დავით კლდიაშვილი — „ჩემი ცხოვრების გზაზე“" },
  { ch:2, no:"2.4", short:"ათი მცნება",            name:"მიხეილ ჯავახიშვილი — „ათი მცნება“" },
  { ch:2, no:"2.5", short:"პირველი კონცერტი",      name:"გურამ დოჩანაშვილი — „პირველი კონცერტი“" },
  { ch:3, no:"3.1", short:"იხვი და მყვარი",        name:"სულხან-საბა ორბელიანი — „იხვი და მყვარი“" },
  { ch:3, no:"3.2", short:"უგუნური მცურავი",       name:"სულხან-საბა ორბელიანი — „უგუნური მცურავი“" },
  { ch:3, no:"3.3", short:"მეფე და მხატვარი",      name:"სულხან-საბა ორბელიანი — „მეფე და მხატვარი“" },
  { ch:3, no:"3.4", short:"ღამურა",                name:"აკაკი წერეთელი — „ღამურა“" },
  { ch:3, no:"3.5", short:"დათა თუთაშხია",         name:"ჭაბუა ამირეჯიბი — „ანდრიევსკის ნაამბობი“" },
  { ch:3, no:"3.6", short:"ცასწავალა",             name:"გოდერძი ჩოხელი — „ცასწავალა“" },
  { ch:3, no:"3.7", short:"თავგაუტეხელი კაცი",     name:"„თავგაუტეხელი კაცი“ — ხალხური ზღაპარი" },
];

const CARDS = [
  // ---------------- 1.1 ნიკო ლორთქიფანიძე
  {t:"1.1", q:"ნიკო ლორთქიფანიძე — რა წლებში ცხოვრობდა?", a:"<b>1880–1944</b>"},
  {t:"1.1", q:"რა თემებზე წერდა ნიკო ლორთქიფანიძე?", a:"ადამიანის <b>სიხარულსა და ტკივილზე</b>, ოცნებასა და ყოველდღიურობაზე."},
  {t:"1.1", q:"რას ეტყოდა ნიკო ლორთქიფანიძე მოსწავლეებს სასწავლო წლის დასაწყისში?", a:"„ყმაწვილებო, ცოტა ვისწავლოთ, მაგრამ ის ცოტა <b>კარგად, ბეჯითად</b> ვისწავლოთ.“"},
  {t:"1.1", q:"რით გამოირჩეოდა ნიკო ლორთქიფანიძის გაკვეთილები?", a:"არ იყო სტანდარტული — პროგრამას გადაუხვევდა და მოზარდებს ესაუბრებოდა <b>ისტორიაზე, მწერლობაზე, თეატრსა და მხატვრობაზე</b>; მოწაფეებს „თქვენობით“ მიმართავდა."},
  {t:"1.1", q:"რას აკეთებდა ნიკო ლორთქიფანიძე სწავლა-განათლებით?", a:"უშურველად იყენებდა <b>მომავალი თაობის აღსაზრდელად</b> — გერმანულს ასწავლიდა და ზნეობის მაგალითსაც აძლევდა.", ex:"განათლება მიიღო საქართველოსა და ავსტრიაში"},

  // ---------------- 1.2 გალაკტიონი
  {t:"1.2", q:"გალაკტიონ ტაბიძე — რა წლებში ცხოვრობდა?", a:"<b>1891–1959</b>"},
  {t:"1.2", q:"რა უწოდა ხალხმა გალაკტიონს სიცოცხლეშივე?", a:"<b>„პოეტების მეფე“</b>"},
  {t:"1.2", q:"რა უწოდა ტიციან ტაბიძემ გალაკტიონს?", a:"<b>„მარტოობის ორდენის კავალერი“</b> — სულიერი მარტოობის გამო."},
  {t:"1.2", q:"სად დაიბადა გალაკტიონი და რამ შთააგონა?", a:"დასავლეთ საქართველოში, სოფელ <b>ჭყვიშში</b>. შთააგონა <b>ბუნების სამყარომ</b> — რიონის ხმაური, ჩიტების ჭიკჭიკი."},
  {t:"1.2", q:"რა არის ლირიკული ლექსი?", a:"ლექსი, რომელშიც გამოხატულია <b>პოეტის შინაგანი სამყარო</b>: განცდები, გრძნობები, განწყობილება; პირადი, ანუ სუბიექტური ხედვა. ხშირად პირველ პირშია დაწერილი."},
  {t:"1.2", q:"საიდან წარმოდგება სიტყვა „ლირიკული“?", a:"ბერძნული სიტყვიდან <b>„lyra“ (ლირა)</b> — მუსიკალური საკრავი, რომლის თანხლებითაც სრულდებოდა ლექსები."},
  {t:"1.2", q:"ვინ არის ლირიკული გმირი?", a:"ის, ვინც ლირიკულ ლექსში <b>თავის ემოციებსა და განწყობილებებს</b> გადმოსცემს.", ex:"ამ ლექსში ლირიკული გმირი თავად გალაკტიონია — უშუალოდ მიმართავს აფხაზეთს"},
  {t:"1.2", q:"რა არის ეპითეტი?", a:"<b>მხატვრული განსაზღვრება</b> — სიტყვა, რომელიც საგანს აცოცხლებს, ემოციურ ან პოეტურ ელფერს სძენს.", ex:"იდუმალი ტყე · ოქროსფერი ოცნება"},
  {t:"1.2", q:"რით განსხვავდება ეპითეტი ლოგიკური განსაზღვრებისგან?", a:"ლოგიკური განსაზღვრება <b>მხოლოდ ნიშან-თვისებას</b> წარმოაჩენს (სველი ჭურჭელი), ეპითეტი კი საგანს <b>ემოციურად</b> ახასიათებს (მტანჯველი ფიქრები)."},

  // ---------------- 1.3 ლადო ასათიანი
  {t:"1.3", q:"ლადო ასათიანი — რა წლებში ცხოვრობდა?", a:"<b>1917–1943</b> — სულ 26 წლის იყო, როცა გარდაიცვალა."},
  {t:"1.3", q:"რა განწყობა აქვს ლადო ასათიანის პოეზიას?", a:"ავადმყოფობისა და ნაადრევი სიკვდილის მიუხედავად, მის სტრიქონებში <b>სასოწარკვეთა არ არის</b> — პირიქით, სიცოცხლის სიყვარულია."},
  {t:"1.3", q:"რას მიიჩნევდა ლადო ასათიანი ყველაზე დიდ ბედნიერებად?", a:"<b>საქართველოში დაბადებას.</b>"},
  {t:"1.3", q:"რას ამბობდა ლადო ასათიანი თავისი წიგნების მიზანზე?", a:"„ვეცდები, ისეთი წიგნები დავწერო, რომ მკითხველს <b>გულწრფელი სიხარული</b> განაცდევინონ, ეს ქვეყანა შეაყვარონ და უკეთესი ცხოვრება მოანატრონ.“"},

  // ---------------- 1.4 ილია
  {t:"1.4", q:"ილია ჭავჭავაძე — რა წლებში ცხოვრობდა?", a:"<b>1837–1907</b>"},
  {t:"1.4", q:"რას მიიჩნევდა ილია წინაპართაგან დატოვებულ „სამ ღვთაებრივ საუნჯედ“?", a:"<b>მამულს, ენას, სარწმუნოებას.</b>"},
  {t:"1.4", q:"რა ასაკში დაბეჭდა ილიამ პირველი კრიტიკული სტატია?", a:"<b>24 წლისა</b> — ამ დროიდან გახდა მისი სახელი ცნობილი."},
  {t:"1.4", q:"რა დააარსა ან აღადგინა ილია ჭავჭავაძემ?", a:"სათავეში ედგა <b>ეროვნულ-განმათავისუფლებელ მოძრაობას</b>; აღადგინა ქართული თეატრი; დააარსა ჟურნალ-გაზეთები, წერა-კითხვის გამავრცელებელი საზოგადოება და ბანკი."},
  {t:"1.4", q:"რა ისტორიულ პერიოდში მოუხდა ილიას მოღვაწეობა?", a:"როცა საქართველო <b>რუსეთის იმპერიის</b> შემადგენლობაში შედიოდა და იდევნებოდა ყოველივე ქართული — ენა, ისტორიული მეხსიერება, ეროვნული თვითმყოფადობა."},

  // ---------------- 1.5 აკაკი
  {t:"1.5", q:"აკაკი წერეთელი — რა წლებში ცხოვრობდა?", a:"<b>1840–1915</b>"},
  {t:"1.5", q:"რა უწოდებდნენ აკაკი წერეთელს და რატომ?", a:"<b>„საქართველოს ბულბულს“</b> — რადგან მისი პოეზია საოცარი მუსიკალურობით გამოირჩევა."},
  {t:"1.5", q:"რა უწოდა იაკობ გოგებაშვილმა აკაკის?", a:"<b>„პატარა საქართველო“</b>. ხალხმა კი ქართული პოეზიის მეფედ აღიარა."},
  {t:"1.5", q:"რას შთააგონებდა აკაკი ერს?", a:"რომ თავისუფლებაზე ოცნების ახდენა მხოლოდ <b>თავდაუზოგავი შრომითა და სწავლა-განათლებით</b> იყო შესაძლებელი."},
  {t:"1.5", q:"ვისთან ერთად გახდა აკაკი ეროვნულ-განმათავისუფლებელი მოძრაობის ლიდერი?", a:"<b>ილია ჭავჭავაძესთან</b> ერთად."},

  // ---------------- 1.6 ანა კალანდაძე
  {t:"1.6", q:"ანა კალანდაძე — რა წლებში ცხოვრობდა?", a:"<b>1924–2008</b>"},
  {t:"1.6", q:"რა უწოდეს ანა კალანდაძეს?", a:"<b>„ქართული პოეზიის დედოფალი“</b>"},
  {t:"1.6", q:"რამდენი წლის იყო ანა კალანდაძე, როცა პირველი ლექსი დაწერა?", a:"<b>თერთმეტი</b> წლის."},
  {t:"1.6", q:"რა არის რითმა?", a:"სალექსო სტრიქონების ბოლოს ერთი და იმავე ან მსგავსი ბგერების <b>კანონზომიერი გამეორება</b>. რითმა ლექსის მუსიკალურობას აძლიერებს."},
  {t:"1.6", q:"რა არის ზუსტი რითმა?", a:"როცა სტრიქონების ბოლოს <b>ერთი და იგივე</b> ბგერები მეორდება.", ex:"ჭადარი / ნაავადარი"},
  {t:"1.6", q:"რა არის არაზუსტი რითმა?", a:"როცა სტრიქონების ბოლოს <b>მსგავსი</b> ბგერები მეორდება.", ex:"მხარამდი / მარადი"},
  {t:"1.6", q:"რომელი სტრიქონი გამხდარა ანა კალანდაძის ლექსის შთამაგონებელი?", a:"გრიგოლ ორბელიანის პოემა „სადღეგრძელოს“ სტრიქონი <b>„სხვა საქართველო სად არის“</b>."},
  {t:"1.6", q:"რომელი ქართველი მწერლების ნაწარმოებებს მოიხსენიებს ანა კალანდაძე ლექსში?", a:"ნიკოლოზ ბარათაშვილის <b>„მერანს“</b>, აკაკი წერეთლის <b>„სულიკოს“</b>, ვაჟა-ფშაველას პერსონაჟებს (ალუდა, ლელა, ონისე)."},

  // ---------------- 2.1 გურამიშვილი
  {t:"2.1", q:"დავით გურამიშვილი — რა წლებში ცხოვრობდა?", a:"<b>1705–1792</b> — მე-18 საუკუნის ქართველი პოეტი."},
  {t:"2.1", q:"რა ჰქვია დავით გურამიშვილის პოეტურ კრებულს?", a:"<b>„დავითიანი“</b>"},
  {t:"2.1", q:"სად გაატარა დავით გურამიშვილმა ცხოვრების უდიდესი ნაწილი?", a:"<b>რუსეთში</b>; სამხედრო სამსახურის შემდეგ <b>უკრაინაში</b> დასახლდა და იქვე გარდაიცვალა."},
  {t:"2.1", q:"რამ განაპირობა დავით გურამიშვილის ცხოვრება?", a:"<b>ეპოქამ</b> — მტერთა გაუთავებელი შემოსევები ამოსუნთქვის საშუალებას არ აძლევდა ქვეყანას.", ex:"„მოისრა ხშირი ქვეყანა, გახდა ვერანად, ტრამლადაო“"},
  {t:"2.1", q:"როგორ გაიგზავნა „დავითიანი“ სამშობლოში?", a:"გურამიშვილმა თავადვე გადაწერა და უკრაინაში მყოფ მეფე ერეკლე II-ის ვაჟს, <b>მირიან ბატონიშვილს</b>, გამოატანა."},

  // ---------------- 2.2 ილიას საჯარო სიტყვა
  {t:"2.2", q:"როდის და სად გაიხსნა წინამძღვრიანთკარის სკოლა?", a:"<b>1883 წლის 4 სექტემბერს</b>, მცხეთის სოფელ წინამძღვრიანთკარში."},
  {t:"2.2", q:"ვინ დააარსა წინამძღვრიანთკარის სამეურნეო სკოლა?", a:"<b>ილია წინამძღვრიშვილმა</b> — ილია ჭავჭავაძის მეგობარმა და საზოგადო მოღვაწემ."},
  {t:"2.2", q:"რით იყო განსაკუთრებული წინამძღვრიანთკარის სკოლა?", a:"ყველა საგანი <b>ქართულ ენაზე</b> ისწავლებოდა (მაშინ სკოლებში რუსულად ასწავლიდნენ); ეს იყო <b>პირველი პროფესიული სასწავლებელი</b> საქართველოში."},
  {t:"2.2", q:"რა ასწავლიდნენ წინამძღვრიანთკარის სკოლაში?", a:"პრაქტიკულ საქმიანობებს: <b>მიწათმოქმედებას, მებაღეობას, მევენახეობას, მეღვინეობას, მეფუტკრეობას.</b>"},
  {t:"2.2", q:"რა ამოცანა ჰქონდა ილიას ამ გამოსვლაში?", a:"უნდა <b>დაერწმუნებინა გლეხები</b>, რომ სასწავლებელში მიღებული ცოდნა მათ შვილებს უკეთეს მომავალს მისცემდა."},
  {t:"2.2", q:"რა არის დარწმუნების სამკუთხედის სამი მხარე?", a:"<b>სანდოობა · ლოგიკა · ემოცია</b>"},
  {t:"2.2", q:"რას ნიშნავს სანდოობა დარწმუნებაში?", a:"კითხვას „<b>რატომ უნდა მოვუსმინო ამ ადამიანს?</b>“ — ავტორიტეტული წყაროები: ცნობილ მწერალთა და მეცნიერთა გამონათქვამები, ანდაზები, იგავები, წინაპართა ტრადიციები, პირადი გამოცდილება."},
  {t:"2.2", q:"რას ნიშნავს ლოგიკა დარწმუნებაში?", a:"კითხვას „<b>რომელი მტკიცებულებები, ფაქტები ადასტურებს ამ ადამიანის მოსაზრებებს?</b>“"},
  {t:"2.2", q:"რას ნიშნავს ემოცია დარწმუნებაში?", a:"კითხვას „<b>როგორ უკავშირდება ჩემს პირად გამოცდილებას</b> მოსმენილი ან წაკითხული?“"},
  {t:"2.2", q:"რა ციტატა ეკუთვნის ილიას სწავლის შესახებ?", a:"„<b>სწავლა-განათლება თვითონ არის სათავე სიმდიდრისა.</b>“"},

  // ---------------- 2.3 კლდიაშვილი
  {t:"2.3", q:"დავით კლდიაშვილი — რა წლებში ცხოვრობდა?", a:"<b>1862–1931</b>"},
  {t:"2.3", q:"რა უწოდებენ დავით კლდიაშვილს და რატომ?", a:"<b>„სევდიანი ღიმილის“</b> მწერალს — ჰქონდა ნიჭი, დაენახა სასაცილო იქ, სადაც სხვები ტკივილს ხედავდნენ, და პირიქით."},
  {t:"2.3", q:"რომელი დიალექტით გამოირჩევა დავით კლდიაშვილის შემოქმედება?", a:"<b>იმერული</b> დიალექტით — ამით თავის მოთხრობებს განუმეორებელი ელფერი შესძინა."},
  {t:"2.3", q:"რა არის მემუარები?", a:"ავტორის <b>მოგონებების წიგნი</b> (ფრანგულად „მემუარები“ მოგონებას ნიშნავს). ავტორი თავადვე არის მთავარი გმირი და მოგვითხრობს საკუთარ ცხოვრებაზე."},
  {t:"2.3", q:"რა სამი ნიშნით განსხვავდება მემუარები გამოგონილი ამბისგან?", a:"1) <b>დოკუმენტურობა</b> — არაფერია გამოგონილი; 2) <b>პირველ პირში თხრობა</b> („მე ვნახე“, „მე მახსოვს“); 3) ისტორიული <b>„სარკის“ პრინციპი</b> — ჩანს, როგორ ცხოვრობდნენ ადამიანები წლების წინ."},
  {t:"2.3", q:"რა ციტატა ეკუთვნის დავით კლდიაშვილს?", a:"„რასაც ვწერდი, მხოლოდ <b>ადამიანის სიყვარული</b> მაწერინებდა!“"},

  // ---------------- 2.4 ჯავახიშვილი
  {t:"2.4", q:"მიხეილ ჯავახიშვილი — რა წლებში ცხოვრობდა?", a:"<b>1880–1937</b>"},
  {t:"2.4", q:"რა დაემართა მიხეილ ჯავახიშვილს 1937 წელს?", a:"გახდა <b>საბჭოთა რეჟიმის რეპრესიების მსხვერპლი</b>; მისი შემოქმედება მრავალი წლით აიკრძალა."},
  {t:"2.4", q:"ვისი ტრადიციების გამგრძელებელია მიხეილ ჯავახიშვილი?", a:"<b>ილია ჭავჭავაძის</b> — თავის ნაწარმოებებში დაუღალავად იცავდა ეროვნულ ინტერესებსა და ადამიანურ ღირსებას."},
  {t:"2.4", q:"ვის და როდის ჩაუწერა მიხეილ ჯავახიშვილმა „ათი მცნება“?", a:"<b>1924 წლის 19 იანვარს</b>, თავის ქალიშვილს, <b>10 წლის ქეთევანს</b>, რვეულში."},
  {t:"2.4", q:"რა ციტატა ეკუთვნის მიხეილ ჯავახიშვილს წიგნზე?", a:"„წიგნი <b>საუკეთესო მეგობარია</b>, იგი არც არასოდეს გიღალატებს და არც არასოდეს მიგატოვებს.“"},

  // ---------------- 2.5 დოჩანაშვილი
  {t:"2.5", q:"გურამ დოჩანაშვილი — რა წლებში ცხოვრობდა?", a:"<b>1939–2021</b>"},
  {t:"2.5", q:"რა არის გურამ დოჩანაშვილის შემოქმედების მთავარი თემა?", a:"<b>პიროვნული და ეროვნული თავისუფლება.</b>"},
  {t:"2.5", q:"რა ფრაზით გამოხატავს დოჩანაშვილი სამყაროს მამოძრავებელ ძალას?", a:"„<b>დედამიწას სიყვარული ატრიალებს.</b>“"},
  {t:"2.5", q:"რას სჯეროდა დოჩანაშვილს ლიტერატურაზე?", a:"რომ მხატვრულ ლიტერატურას <b>ადამიანის გარდაქმნა</b> შეუძლია — ყოველი კარგი მოთხრობის წაკითხვის შემდეგ ხდები ოდნავ უფრო უკეთესი."},
  {t:"2.5", q:"რა არის „ჯაჭვური“ პრინციპი თხრობაში?", a:"ამბის გადმოცემა <b>ქრონოლოგიური თანმიმდევრობით</b>: „ჯაჭვის“ პირველი რგოლი საწყისი მოვლენაა, მომდევნო რგოლები — შემდგომი მოვლენები, ბოლო რგოლი — ყველაზე გვიან მომხდარი."},
  {t:"2.5", q:"რა არის ჩარჩო-თხრობა?", a:"თხრობა, სადაც <b>პირველი და ბოლო ნაწილები ჩარჩოსავით კრავს</b> ძირითად ნაწილს.", ex:"„პირველი კონცერტი“: I და III ნაწილი — ნუგზარის მღელვარება კონცერტის წინ, II ნაწილი — მოგონებები"},
  {t:"2.5", q:"რამდენ ნაწილად იყოფა „პირველი კონცერტი“ და როგორ?", a:"<b>სამ</b> ნაწილად: I და III — ახლანდელი დრო (სოლო კონცერტის მოლოდინი), II — ნუგზარის მოგონებები წარსულიდან."},

  // ---------------- 3.1 იხვი და მყვარი
  {t:"3.1", q:"სულხან-საბა ორბელიანი — რა წლებში ცხოვრობდა?", a:"<b>1658–1725</b>"},
  {t:"3.1", q:"რა არის იგავ-არაკი?", a:"<b>მოკლე ამბავი-დარიგება</b>, რომელშიც ადამიანთა ხასიათები და ადამიანური ნაკლოვანებებია ნაჩვენები."},
  {t:"3.1", q:"რა ხერხია დამახასიათებელი იგავ-არაკისთვის?", a:"<b>ალეგორია</b> — ადამიანები წარმოდგენილია ცხოველების, ფრინველების თუ მცენარეების სახით, რომლებსაც ადამიანური თვისებები აქვთ."},
  {t:"3.1", q:"რა ჰქვია იგავ-არაკის დასკვნას?", a:"<b>შეგონება</b>, ანუ „მორალი“ — მოკლე დარიგება, რომელიც ცხოვრებისეულ გაკვეთილს გვაძლევს."},
  {t:"3.1", q:"რას უწოდებდა სულხან-საბა იგავ-არაკს?", a:"<b>„სიტყვით საჩვენებელ მაგალითს“.</b>"},
  {t:"3.1", q:"რა განსხვავებული გადაწყვეტილება მიიღეს იხვმა და მყვარმა?", a:"წყალი რომ იკლო, <b>იხვი გაფრინდა</b> სხვაგან, <b>მყვარი კი დარჩა</b> — სამკვიდროს დატოვება არ ისურვა."},
  {t:"3.1", q:"რას ნიშნავს „მყვარი“?", a:"<b>დიდი ბაყაყი.</b>", ex:"სამკვიდრო — მემკვიდრეობით მიღებული საცხოვრებელი ადგილი"},
  {t:"3.1", q:"რა მოღვაწეობა ჰქონდა სულხან-საბას?", a:"სამეფო კარზე ტრიალებდა, <b>ბერად აღიკვეცა</b> დავით გარეჯის მონასტერში, იყო <b>ელჩი</b> სპარსეთში, იტალიასა და საფრანგეთში."},
  {t:"3.1", q:"სად გარდაიცვალა სულხან-საბა ორბელიანი?", a:"სამშობლოდან შორს, <b>მოსკოვში</b>, და იქვე დაიკრძალა."},

  // ---------------- 3.2 უგუნური მცურავი
  {t:"3.2", q:"რა ეპოქაში დაიბადა სულხან-საბა ორბელიანი?", a:"<b>XVII საუკუნეში</b> — როცა ირანისა და ოსმალეთის ბატონობა სულს უხუთავდა საქართველოს."},
  {t:"3.2", q:"რა ითქვა სულხან-საბაზე მისი დროის ხალხში?", a:"„<b>მთელ საქართველოს მამად მიაჩნიაო.</b>“"},
  {t:"3.2", q:"რა ზნეობრივი გაკვეთილია „უგუნურ მცურავში“?", a:"საკუთარი შესაძლებლობების <b>სწორი შეფასების</b> აუცილებლობა — თავის გადაფასება საფრთხეს იწვევს."},
  {t:"3.2", q:"რა აერთიანებს სულხან-საბას სამ იგავს ამ თავში?", a:"ყველა <b>ზნეობრივ არჩევანს</b> ეხება და შეგონებით მთავრდება: „იხვი და მყვარი“, „უგუნური მცურავი“, „მეფე და მხატვარი“."},

  // ---------------- 3.3 მეფე და მხატვარი
  {t:"3.3", q:"რა ჟანრისაა „მეფე და მხატვარი“?", a:"<b>იგავ-არაკი</b> — სულხან-საბა ორბელიანის კრებულიდან „სიბრძნე სიცრუისა“."},
  {t:"3.3", q:"რა არის ალეგორია?", a:"ხერხი, როცა მწერალი <b>პირდაპირ არ ამბობს სათქმელს</b>, არამედ შენიღბულად, სხვა ამბით გადმოგვცემს."},
  {t:"3.3", q:"სად შეიძლება იყოს მოცემული იგავის შეგონება?", a:"ან <b>ცალკე</b>, ტექსტის ბოლოს, ან <b>ტექსტის შიგნითვე</b> იკითხებოდეს."},

  // ---------------- 3.4 ღამურა
  {t:"3.4", q:"რა ჟანრში წერს აკაკი „ღამურას“?", a:"ავტორმა თავად უწოდა <b>ზღაპარი</b>; შინაარსით იგავ-არაკია — ალეგორიით და შეგონებით."},
  {t:"3.4", q:"რა ინატრა უგნურმა თაგუნამ?", a:"<b>ჩიტობა</b> — ფრთების გამოსხმა და მაღლა ფრენა; დასწყევლა თავისი გაჩენა და ბუნების გმობა დაიწყო."},
  {t:"3.4", q:"რა შედეგი მიიღო თაგუნამ ფრთების გამოსხმით?", a:"<b>ჩიტებმა</b> არ მიიღეს და დაჰკრეს ბრჭყალები, <b>თაგვებმაც</b> აითვალწუნეს — ორივე ტომმა უარყო და ნანგრევში შეაფარა თავი."},
  {t:"3.4", q:"რა არის აკაკის „ღამურას“ შეგონება?", a:"„<b>ნურავინ ისხამს სხვის ქურქსა და ნუ სცვლის თვისსა ენასა</b>“ — საკუთარი ტომისა და ენის ღალატი დამღუპველია."},
  {t:"3.4", q:"რა ხერხს იყენებს აკაკი თაგუნას დასაწყისშივე?", a:"<b>პირდაპირ დახასიათებას</b> — „უგნურს“ უწოდებს, რითაც მკითხველს წინასწარ განაწყობს პერსონაჟის მიმართ."},
  {t:"3.4", q:"რომელი ბერძენი მეიგავეს აქვს „ღამურას“ მსგავსი იგავი?", a:"<b>ეზოპეს</b> — „ფრინველები, მხეცები და ღამურა“."},
  {t:"3.4", q:"რას ნიშნავს „იუკადრისა“?", a:"<b>ითაკილა</b>, თავის შესაფერისად არ მიიჩნია.", ex:"გმობა — გაკიცხვა, დაძრახვა; თავლაფდასხმული — შერცხვენილი"},

  // ---------------- 3.5 დათა თუთაშხია
  {t:"3.5", q:"ჭაბუა ამირეჯიბი — რა წლებში ცხოვრობდა?", a:"<b>1921–2013</b>"},
  {t:"3.5", q:"რომელია ჭაბუა ამირეჯიბის გამორჩეული რომანი?", a:"<b>„დათა თუთაშხია“</b> — ასახავს მე-19 ს. ბოლოსა და მე-20 ს. დასაწყისის საქართველოს."},
  {t:"3.5", q:"რა სახე შექმნა ავტორმა დათა თუთაშხიაში?", a:"<b>კეთილშობილი ყაჩაღის</b> სახე — მთელი ცხოვრება ბოროტებას უპირისპირდება და სამართლიანობას იცავს."},
  {t:"3.5", q:"ვინ მოგვითხრობს „ანდრიევსკის ნაამბობს“ და რა ფორმით?", a:"რომანის პერსონაჟი, <b>მეფის რუსეთის არმიის ოფიცერი ანდრიევსკი</b> — ესაა <b>ჩანაწერი დღიურიდან</b>."},
  {t:"3.5", q:"რა დაემართა ჭაბუა ამირეჯიბის ოჯახს?", a:"<b>მამა დაუხვრიტეს, დედა გადაასახლეს</b>; თავად მწერალი ანტისაბჭოთა საქმიანობის ბრალდებით მრავალი წლით იყო დაპატიმრებული."},
  {t:"3.5", q:"რა ციტატა ეკუთვნის ჭაბუა ამირეჯიბს ღირსებაზე?", a:"„<b>ღირსება ერთი მონაცემია, მისი სწორად გამოყენების უნარი — მეორე.</b>“"},

  // ---------------- 3.6 ცასწავალა
  {t:"3.6", q:"გოდერძი ჩოხელი — რა წლებში ცხოვრობდა?", a:"<b>1954–2007</b>"},
  {t:"3.6", q:"სად დაიბადა გოდერძი ჩოხელი?", a:"<b>გუდამაყრის ხეობის სოფელ ჩოხში</b> — მთის ბუნებამ და მამაპაპურმა ტრადიციებმა წარუშლელი კვალი დატოვა მის შემოქმედებაზე."},
  {t:"3.6", q:"რა პროფესიისა იყო გოდერძი ჩოხელი?", a:"<b>კინორეჟისორი</b> — ქმნიდა ფილმებს, წერდა სცენარებსა და მოთხრობებს."},
  {t:"3.6", q:"რა არის სიმბოლო?", a:"კონკრეტული საგანი ან მოვლენა, რომელსაც პირდაპირი მნიშვნელობის გარდა აქვს <b>სხვა, უფრო ღრმა და განზოგადებული</b> მნიშვნელობა. (ბერძნ. „ვაერთებ“)"},
  {t:"3.6", q:"რომელი ორი მნიშვნელობაა გაერთიანებული სიმბოლოში?", a:"<b>პირდაპირი</b> — ის, რასაც თვალით ვხედავთ, და <b>გადატანითი</b> — ღრმა, განზოგადებული შინაარსი."},
  {t:"3.6", q:"რის სიმბოლოა ცა „ცასწავალაში“?", a:"<b>შინაგანი თავისუფლების, მიუწვდომელი ოცნების, ჭეშმარიტების</b> სიმბოლო — არა უბრალოდ ფიზიკური სივრცე."},
  {t:"3.6", q:"რომელ ნაწარმოებს მიუძღვნა ჩოხელმა „ცასწავალა“?", a:"<b>„პატარა უფლისწულს“</b> — ანტუან დე სენტ-ეგზიუპერის ბიჭუნას, რომელიც სხვა პლანეტიდან მოვიდა დედამიწაზე."},
  {t:"3.6", q:"რა აერთიანებს „ცასწავალას“ გმირსა და პატარა უფლისწულს?", a:"სწრაფვა <b>სულიერი თავისუფლებისკენ</b>, სულიერი მარტოობა, მიწიერი სამყაროს მიუღებლობა, თავგანწირვა ოცნებისთვის."},
  {t:"3.6", q:"რომელი უცხოელი მწერლის ტექსტი ეხმიანება „ცასწავალას“?", a:"<b>რიჩარდ ბახის</b> „თოლია, სახელად ჯონათან ლივინგსტონი“ — თოლია, რომელსაც ფრენა ყველაზე მეტად უყვარდა."},

  // ---------------- 3.7 თავგაუტეხელი კაცი
  {t:"3.7", q:"რა ჟანრისაა „თავგაუტეხელი კაცი“?", a:"<b>ქართული ხალხური ზღაპარი.</b>"},
  {t:"3.7", q:"რას ნიშნავს „თავგაუტეხელი“?", a:"ადამიანი, რომელსაც <b>კონფლიქტი არავისთან მოსვლია</b> — არავის გაუტეხია თავი."},
  {t:"3.7", q:"რა დალოცვა თქვა მოხუცმა?", a:"„ამ ხნის კაცი ვარ, ჯერ <b>თავი ჩემთვის არავის გაუტეხნია</b> და ნურც მივალ იმ ზომამდის, რომ ვინმემ გამიტეხოსო.“"},

/* ============================== ლოგიკა ============================== */
const KEY = 'mzia-cards-lit7-v1';
const TOPIC_OF = {};
TOPICS.forEach(t => TOPIC_OF[t.no] = t);
CARDS.forEach((c, n) => { c.id = n; c.ch = TOPIC_OF[c.t].ch; });

QUIZ.forEach((q, n) => { q.id = n; q.ch = TOPIC_OF[q.t].ch; });

const ALL_TOPICS = TOPICS.map(t => t.no);
const countOf = {}, quizCountOf = {};
ALL_TOPICS.forEach(n => {
  countOf[n] = CARDS.filter(c => c.t === n).length;
  quizCountOf[n] = QUIZ.filter(q => q.t === n).length;
});
const cntOf = n => (mode === 'quiz' ? quizCountOf[n] : countOf[n]);
const unitWord = () => (mode === 'quiz' ? 'კითხვა' : 'ბარათი');

function shuffle(a){
  a = a.slice();
  for (let k = a.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    const tmp = a[k]; a[k] = a[j]; a[j] = tmp;
  }
  return a;
}

/* picked — მონიშნული თემების სია (ყოველთვის სრული ჭეშმარიტება) */
let picked = ALL_TOPICS.slice();
let known = {};
let openFilter = false;
let mode = 'cards';
let i = 0, flipped = false;
/* ტესტის მდგომარეობა */
let qList = [], qPos = 0, qChosen = null, qScore = 0, qOptOrder = [0,1,2,3];

try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const s = JSON.parse(raw);
    if (Array.isArray(s.picked) && s.picked.length) {
      const ok = s.picked.filter(n => ALL_TOPICS.indexOf(n) > -1);
      if (ok.length) picked = ok;
    }
    if (s.known && typeof s.known === 'object') known = s.known;
    if (s.mode === 'quiz' || s.mode === 'cards') mode = s.mode;
  }
} catch (e) {}

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify({ picked: picked, known: known, mode: mode }));
  } catch (e) {}
}

const topicsOfCh = no => TOPICS.filter(t => t.ch === no).map(t => t.no);
const chPicked  = no => topicsOfCh(no).every(n => picked.indexOf(n) > -1);
const chPartial = no => !chPicked(no) && topicsOfCh(no).some(n => picked.indexOf(n) > -1);
const selectedCards = () => CARDS.filter(c => picked.indexOf(c.t) > -1);
const selectedQuiz  = () => QUIZ.filter(q => picked.indexOf(q.t) > -1);

function startQuiz(){
  qList = shuffle(selectedQuiz());
  qPos = 0; qChosen = null; qScore = 0;
  qOptOrder = shuffle([0,1,2,3]);
}
function chooseOpt(k){
  if (qChosen !== null) return;
  qChosen = k;
  if (k === qList[qPos].c) qScore++;
  render();
}
function nextQuestion(){
  qPos++; qChosen = null; qOptOrder = shuffle([0,1,2,3]); render();
}
function setMode(m){
  if (mode === m) return;
  mode = m;
  if (m === 'quiz') startQuiz(); else { i = 0; flipped = false; }
  save(); render();
}

function setPicked(list){
  picked = list.length ? list : ALL_TOPICS.slice();
  i = 0; flipped = false;
  if (mode === 'quiz') startQuiz();
  save(); render();
}
function toggleTopic(no){
  const on = picked.indexOf(no) > -1;
  setPicked(on ? picked.filter(x => x !== no) : ALL_TOPICS.filter(x => picked.indexOf(x) > -1 || x === no));
}
function toggleChapter(no){
  const mine = topicsOfCh(no);
  if (chPicked(no)) setPicked(picked.filter(x => mine.indexOf(x) < 0));
  else setPicked(ALL_TOPICS.filter(x => picked.indexOf(x) > -1 || mine.indexOf(x) > -1));
}
function onlyChapter(no){ setPicked(topicsOfCh(no)); }
function markKnown(id){ known[id] = 1; flipped = false; save(); render(); }
function resetSelection(){
  selectedCards().forEach(c => { delete known[c.id]; });
  i = 0; flipped = false; save(); render();
}
function go(step){ i += step; flipped = false; render(); }
function doFlip(){
  flipped = !flipped;
  const f = document.querySelector('.flip');
  if (f) f.classList.toggle('on', flipped);
}

/* ---------- ფილტრის წარწერა ---------- */
function filterLabel(){
  const n = (mode === 'quiz' ? selectedQuiz() : selectedCards()).length;
  const u = ' ' + unitWord();
  if (picked.length === ALL_TOPICS.length) return ['სრული მასალა', n + u + ' · ყველა თავი და თემა'];
  const chs = CHAPTERS.filter(c => chPicked(c.no) && !chPartial(c.no)).map(c => 'თავი ' + c.no);
  const onlyWhole = CHAPTERS.every(c => chPicked(c.no) || topicsOfCh(c.no).every(x => picked.indexOf(x) < 0));
  if (onlyWhole && chs.length) return [chs.join(' + '), n + u];
  if (picked.length === 1){
    const t = TOPIC_OF[picked[0]];
    return [t.no + ' ' + t.short, n + u + ' · თავი ' + t.ch];
  }
  return [picked.length + ' თემა არჩეული', n + u];
}

/* ---------- ფილტრის პანელი ---------- */
function renderPanel(){
  const p = document.getElementById('panel');
  p.hidden = !openFilter;
  document.getElementById('fbArrow').textContent = openFilter ? '▴' : '▾';
  if (!openFilter) { p.innerHTML = ''; return; }
  p.innerHTML = '';

  const h1 = document.createElement('h3');
  h1.textContent = 'თავები';
  p.appendChild(h1);

  CHAPTERS.forEach(c => {
    const on = chPicked(c.no), part = chPartial(c.no);
    const r = document.createElement('div');
    r.className = 'row ch' + (on ? ' on' : '');
    r.innerHTML = '<span class="box">' + (on ? '✓' : (part ? '–' : '')) + '</span>'
      + '<span class="lbl">თავი ' + c.no + '<span class="sub">' + c.name + '</span></span>'
      + '<span class="n">' + (mode === 'quiz' ? QUIZ : CARDS).filter(x => x.ch === c.no).length + '</span>';
    if (part) r.querySelector('.box').style.color = 'rgba(27,36,56,.5)';
    r.onclick = () => toggleChapter(c.no);
    p.appendChild(r);
  });

  const h2 = document.createElement('h3');
  h2.className = 'mt';
  h2.textContent = 'თემები';
  p.appendChild(h2);

  TOPICS.forEach(t => {
    const on = picked.indexOf(t.no) > -1;
    const r = document.createElement('div');
    r.className = 'row' + (on ? ' on' : '');
    r.innerHTML = '<span class="box">' + (on ? '✓' : '') + '</span>'
      + '<span class="lbl">' + t.no + ' · ' + t.short
      + '<span class="sub">თავი ' + t.ch + '</span></span>'
      + '<span class="n">' + cntOf(t.no) + '</span>';
    r.onclick = () => toggleTopic(t.no);
    p.appendChild(r);
  });

  const btns = document.createElement('div');
  btns.className = 'pbtns';
  const mk = (txt, cls, fn) => {
    const b = document.createElement('button');
    b.className = 'pbtn ' + cls; b.type = 'button'; b.textContent = txt; b.onclick = fn;
    return b;
  };
  CHAPTERS.forEach(c => btns.appendChild(
    mk('მხოლოდ თავი ' + c.no, '', () => onlyChapter(c.no))));
  if (CHAPTERS.length % 2 === 1) btns.appendChild(mk('ყველაფერი', 'full', () => setPicked(ALL_TOPICS.slice())));
  else btns.appendChild(mk('ყველაფერი', '', () => setPicked(ALL_TOPICS.slice())));
  btns.appendChild(mk('✓ მზადაა', 'fill full', () => { openFilter = false; render(); }));
  p.appendChild(btns);
}

/* ---------- ბარათები ---------- */
function render(){
  const lbl = filterLabel();
  document.getElementById('fbT1').textContent = lbl[0];
  document.getElementById('fbT2').textContent = lbl[1];
  renderPanel();

  document.getElementById('modeCards').className = 'mode' + (mode === 'cards' ? ' on' : '');
  document.getElementById('modeQuiz').className  = 'mode' + (mode === 'quiz'  ? ' on' : '');

  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (openFilter) return;
  if (mode === 'quiz') { renderQuiz(stage); return; }

  const sel = selectedCards();
  const queue = sel.filter(c => !known[c.id]);
  const knownN = sel.length - queue.length;

  if (sel.length === 0){
    stage.innerHTML = '<div class="empty">ბარათი არ არის — ფილტრში აირჩიე თავი ან თემა.</div>';
    return;
  }

  if (queue.length === 0){
    const d = document.createElement('div');
    d.className = 'done';
    d.innerHTML = '<div class="big">🏆</div><h2>ყველა ბარათი იცი!</h2>'
      + '<p>' + sel.length + ' ბარათი სრულად გაიარე. გაიმეორე თავიდან, რომ კარგად დაიმახსოვრო.</p>';
    const b = document.createElement('button');
    b.className = 'btn good wide'; b.type = 'button';
    b.textContent = '🔄 თავიდან გავიმეორო';
    b.onclick = resetSelection;
    d.appendChild(b);
    stage.appendChild(d);
    return;
  }

  const idx = ((i % queue.length) + queue.length) % queue.length;
  const card = queue[idx];
  const topic = TOPIC_OF[card.t];

  const cnt = document.createElement('div');
  cnt.className = 'counter';
  cnt.textContent = (idx + 1) + ' / ' + queue.length + '  ·  ✓ ვიცი ' + knownN + ' / ' + sel.length;
  stage.appendChild(cnt);

  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + (knownN / sel.length * 100) + '%"></i>';
  stage.appendChild(bar);

  const flip = document.createElement('div');
  flip.className = 'flip' + (flipped ? ' on' : '');
  flip.innerHTML =
    '<div class="inner">'
    + '<div class="face"><div class="tag"></div><div class="q"></div>'
    +   '<div class="tip">👆 დააჭირე ბარათს — პასუხი გამოჩნდება</div></div>'
    + '<div class="face back"><div class="tag"></div><div class="a"></div>'
    +   '<div class="ex"></div><div class="tip">👆 დააჭირე — ისევ კითხვა</div></div>'
    + '</div>';
  const label = 'თავი ' + topic.ch + ' · ' + topic.no + ' ' + topic.short;
  flip.querySelectorAll('.tag').forEach(el => el.textContent = label);
  flip.querySelector('.q').textContent = card.q;
  flip.querySelector('.a').innerHTML = card.a;
  const ex = flip.querySelector('.ex');
  if (card.ex) ex.innerHTML = '„' + card.ex + '“'; else ex.remove();
  stage.appendChild(flip);

  let t0 = null, usedTouch = false;
  flip.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; t0 = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  flip.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    t0 = null; usedTouch = true;
    setTimeout(() => usedTouch = false, 500);
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) doFlip();
  });
  flip.addEventListener('click', () => { if (!usedTouch) doFlip(); });

  const nav = document.createElement('div');
  nav.className = 'nav';
  const mkb = (txt, cls, fn) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls; b.type = 'button'; b.textContent = txt; b.onclick = fn;
    return b;
  };
  nav.appendChild(mkb('← წინა', 'light', () => go(-1)));
  nav.appendChild(mkb('✓ ვიცი', 'good', () => markKnown(card.id)));
  nav.appendChild(mkb('შემდეგი →', 'light', () => go(1)));
  stage.appendChild(nav);

  if (knownN > 0){
    const r = document.createElement('button');
    r.className = 'btn wide'; r.type = 'button';
    r.textContent = '🔄 მონიშვნების გასუფთავება (' + knownN + ')';
    r.onclick = resetSelection;
    stage.appendChild(r);
  }
}

/* ---------- ტესტი ---------- */
const LETTERS = ['ა', 'ბ', 'გ', 'დ'];

function renderQuiz(stage){
  if (qList.length === 0) startQuiz();

  if (selectedQuiz().length === 0){
    stage.innerHTML = '<div class="empty">ამ არჩევანზე ტესტის კითხვა არ არის — ფილტრში აირჩიე სხვა თავი ან თემა.</div>';
    return;
  }

  // --- შედეგის ეკრანი
  if (qPos >= qList.length){
    const pct = Math.round(qScore / qList.length * 100);
    const face = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '💪' : '📚';
    const word = pct >= 90 ? 'ბრწყინვალედ!' : pct >= 70 ? 'ძალიან კარგი!'
               : pct >= 50 ? 'კარგია, გაიმეორე!' : 'ჯერ ბარათები გაიარე და სცადე ისევ.';
    const d = document.createElement('div');
    d.className = 'done';
    d.innerHTML = '<div class="big">' + face + '</div>'
      + '<h2>' + qScore + ' / ' + qList.length + ' — ' + pct + '%</h2>'
      + '<p>' + word + '</p>';
    const b = document.createElement('button');
    b.className = 'btn good wide'; b.type = 'button'; b.textContent = '🔄 ტესტი თავიდან';
    b.onclick = () => { startQuiz(); render(); };
    d.appendChild(b);
    const b2 = document.createElement('button');
    b2.className = 'btn wide'; b2.type = 'button'; b2.textContent = '🎴 ბარათებზე გადასვლა';
    b2.onclick = () => setMode('cards');
    d.appendChild(b2);
    stage.appendChild(d);
    return;
  }

  const item = qList[qPos];
  const topic = TOPIC_OF[item.t];

  const sc = document.createElement('div');
  sc.className = 'score';
  sc.innerHTML = '<span>კითხვა ' + (qPos + 1) + ' / ' + qList.length + '</span>'
               + '<span>✓ სწორი: ' + qScore + '</span>';
  stage.appendChild(sc);

  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + (qPos / qList.length * 100) + '%"></i>';
  stage.appendChild(bar);

  const box = document.createElement('div');
  box.className = 'qbox';
  box.innerHTML = '<div class="tagq"></div><div class="qt"></div>';
  box.querySelector('.tagq').textContent =
    'თავი ' + topic.ch + ' · ' + topic.no + ' ' + topic.short;
  box.querySelector('.qt').textContent = item.q;
  stage.appendChild(box);

  const opts = document.createElement('div');
  opts.className = 'opts';
  qOptOrder.forEach((origIdx, shown) => {
    const b = document.createElement('button');
    b.type = 'button';
    let cls = 'opt';
    if (qChosen !== null){
      b.disabled = true;
      if (origIdx === item.c) cls += ' ok';
      else if (origIdx === qChosen) cls += ' bad';
      else cls += ' dim';
    }
    b.className = cls;
    b.innerHTML = '<span class="let">' + LETTERS[shown] + '</span><span class="ot"></span>';
    b.querySelector('.ot').textContent = item.o[origIdx];
    b.onclick = () => chooseOpt(origIdx);
    opts.appendChild(b);
  });
  stage.appendChild(opts);

  if (qChosen !== null){
    const fb = document.createElement('div');
    const right = qChosen === item.c;
    fb.className = 'fb ' + (right ? 'ok' : 'bad');
    fb.textContent = right ? '✓ სწორია!' : '✗ სწორი პასუხი: ' + item.o[item.c];
    stage.appendChild(fb);

    const nb = document.createElement('button');
    nb.className = 'btn good wide'; nb.type = 'button';
    nb.textContent = (qPos + 1 >= qList.length) ? 'შედეგის ნახვა →' : 'შემდეგი კითხვა →';
    nb.onclick = nextQuestion;
    stage.appendChild(nb);
  }
}

document.getElementById('filterbtn').onclick = () => { openFilter = !openFilter; render(); };
document.getElementById('modeCards').onclick = () => setMode('cards');
document.getElementById('modeQuiz').onclick  = () => setMode('quiz');

document.addEventListener('keydown', e => {
  if (openFilter) return;
  if (mode === 'quiz'){
    const n = ['1','2','3','4'].indexOf(e.key);
    if (n > -1 && qChosen === null && qPos < qList.length){
      chooseOpt(qOptOrder[n]);
    } else if ((e.key === 'Enter' || e.key === ' ') && qChosen !== null){
      e.preventDefault(); nextQuestion();
    }
    return;
  }
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); doFlip(); }
});

if (mode === 'quiz') startQuiz();
render();
</script>
